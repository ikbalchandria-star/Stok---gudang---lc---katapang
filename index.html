<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f0f0f0}

.modalBox{background:white;width:100%;max-width:350px;padding:20px;border-radius:20px;text-align:center}
.modalBox input{width:100%;padding:16px;border-radius:12px;border:2px solid #15803d;text-align:center;font-size:20px;font-weight:900;letter-spacing:4px;margin:10px 0}

<button onclick="tambahBarang()" class="btn" style="background:#15803d;color:white;width:50px">+</button>
</div>
<div style="display:flex;gap:6px">
<input type="file" id="fileSO" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(event)">
<button onclick="document.getElementById('fileSO').click()" class="btn" style="flex:1;background:#2563eb;color:white">📂 IMPORT EXCEL</button>
<button onclick="downloadTemplate()" class="btn" style="background:white;border:2px solid #2563eb;color:#2563eb">Template</button>
</div>
<div style="display:flex;gap:6px">
<input id="cari" oninput="load()" placeholder="🔍 Cari barang" style="flex:1;padding:14px;border-radius:12px;border:1px solid #ccc">
<button onclick="resetHarian()" class="btn" style="background:#facc15;color:black">🔄 RESET</button>
</div>
</div>
<div id="list" style="padding:12px">Loading...</div>
</div>

<!-- MODAL PIN MASUK -->
<div id="modalPin" class="modal"><div class="modalBox">
<b id="pinTitle">MASUKAN PIN</b><br><small id="pinDesc"></small>
<input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="****">
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="closeModal('modalPin')" class="btn" style="flex:1;background:#eee">Batal</button>
<button onclick="prosesPinMasuk()" class="btn" style="flex:1;background:#15803d;color:white">MASUK</button>
</div>
</div></div>

<!-- MODAL BUAT PIN -->
<div id="modalBuatPin" class="modal"><div class="modalBox">
<b>BUAT PIN BARU</b><br><small id="buatPinToko"></small>
<input id="pinBaru1" type="password" inputmode="numeric" placeholder="PIN baru (4 digit)">
<input id="pinBaru2" type="password" inputmode="numeric" placeholder="Ulangi PIN">
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="closeModal('modalBuatPin')" class="btn" style="flex:1;background:#eee">Batal</button>
<button onclick="prosesBuatPin()" class="btn" style="flex:1;background:#facc15;color:black">SIMPAN PIN</button>
</div>
</div></div>

<!-- MODAL KUNCI / GANTI -->
<div id="modalKunci" class="modal"><div class="modalBox">
<b id="kunciTitle">KUNCI TOKO</b><br><small id="kunciDesc"></small>
<input id="kunciPin" type="password" inputmode="numeric" placeholder="Masukkan PIN lama / Master 9999">
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="closeModal('modalKunci')" class="btn" style="flex:1;background:#eee">Batal</button>
<button onclick="prosesKunci()" class="btn" style="flex:1;background:#15803d;color:white">LANJUT</button>
</div>
</div></div>

<!-- MODAL EDIT ANGKA -->
<div id="modalEdit" class="modal"><div class="modalBox">
<b id="editTitle">EDIT</b><br><small id="editDesc"></small>
<input id="editInput" type="number" placeholder="0">
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="closeModal('modalEdit')" class="btn" style="flex:1;background:#eee">Batal</button>
<button onclick="prosesEdit()" class="btn" style="flex:1;background:#15803d;color:white">SIMPAN</button>
</div>
</div></div>
