<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUDANG LABBAIK KATAPANG</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;padding:12px;background:#f2f2f2;margin:0}
.header{display:flex;align-items:center;gap:12px;margin:12px 0;background:#111;padding:12px 16px;border-radius:16px;color:#fff}
.header img{width:52px;height:52px;border-radius:12px;background:#111;object-fit:cover}
.status{background:#fff;color:#111;padding:12px;border-radius:12px;font-size:13px;margin-bottom:10px;border:1px solid #ddd;font-weight:700}
.row{display:flex;gap:6px;margin-bottom:10px}
input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px;background:#fff;outline:none}
input.small{flex:0.6}
button.main{width:100%;padding:16px;background:#FFB800;border:0;border-radius:12px;font-weight:900;font-size:17px;color:#111}
.item{background:#fff;padding:12px;border-radius:14px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;padding:10px 14px;border-radius:10px;font-weight:800;color:#fff;font-size:13px}
.btn-plus{background:#00c853} .btn-minus{background:#ff6d00} .btn-edit{background:#2962ff} .btn-del{background:#111}
.sisa{color:#00c853;font-weight:900}
</style>
</head>
<body>
<div class="header">
<img src="icon.png" alt="logo">
<div><div style="font-weight:900;font-size:20px;line-height:1">GUDANG LABBAIK</div><div style="letter-spacing:3px;font-size:11px;opacity:.8">KATAPANG</div></div>
</div>
<div class="status" id="status">⏳ Connecting...</div>
<div class="row">
<input id="nama" placeholder="Nama barang cth: Ayam pot besar">
<input id="stok" class="small" type="number" placeholder="Stok">
<input id="pakai" class="small" type="number" placeholder="Pakai">
</div>
<button class="main" onclick="tambah()">+ Tambah Barang</button>
<div id="list"></div>
<script>
const SUPA_URL="https://lgunwtgwlzggfmfjzxqm.supabase.co";
const SUPA_KEY="sb_publishable_9cBL507qhMKrDzofjIow-A_Y0d4Tesk";
const client=supabase.createClient(SUPA_URL,SUPA_KEY);
async function load(){
 try{
  let res=await client.from('stok').select('*').order('id',{ascending:false});
  if(res.error) throw res.error;
  document.getElementById('status').innerHTML='✅ Connected - GUDANG LABBAIK - ' + (res.data?.length||0) + ' barang';
  let h='';
  (res.data||[]).forEach(r=>{
   let sisa=(r.stok||0)-(r.terpakai||0);
   let safeNama = (r.nama_barang||'').replace(/'/g, "\\'");
   h+=`<div class="item"><div class="top"><div><b>${r.nama_barang}</b><br><small>Stok: ${r.stok} | Pakai: ${r.terpakai} | <span class="sisa">Sisa: ${sisa}</span></small></div><button class="btn btn-del" onclick="hapus(${r.id})">Hapus</button></div><div class="controls"><button class="btn btn-plus" onclick="ubahStok(${r.id},${r.stok},1)">+ Stok</button><button class="btn btn-minus" onclick="ubahStok(${r.id},${r.stok},-1)">- Stok</button><button class="btn btn-plus" onclick="ubahPakai(${r.id},${r.terpakai},1)">+ Pakai</button><button class="btn btn-minus" onclick="ubahPakai(${r.id},${r.terpakai},-1)">- Pakai</button><button class="btn btn-edit" onclick="editItem(${r.id},'${safeNama}',${r.stok},${r.terpakai})">Edit</button></div></div>`;
  });
  if(!res.data||res.data.length==0) h="<p style='text-align:center;color:#888;margin-top:30px'>Belum ada barang</p>";
  document.getElementById('list').innerHTML=h;
 }catch(e){document.getElementById('status').innerHTML='❌ '+e.message}
}
async function tambah(){
 let n=document.getElementById('nama').value.trim(); let s=parseInt(document.getElementById('stok').value||0); let p=parseInt(document.getElementById('pakai').value||0);
 if(!n) return alert('Isi nama!');
 let res=await client.from('stok').insert([{nama_barang:n,stok:s,terpakai:p}]); if(res.error) alert(res.error.message); else {document.getElementById('nama').value='';document.getElementById('stok').value='';document.getElementById('pakai').value=''; load();}
}
async function hapus(id){ if(!confirm('Hapus?')) return; await client.from('stok').delete().eq('id',id); load();}
async function ubahStok(id,cur,d){ let v=cur+d; if(v<0) v=0; await client.from('stok').update({stok:v}).eq('id',id); load();}
async function ubahPakai(id,cur,d){ let v=cur+d; if(v<0) v=0; await client.from('stok').update({terpakai:v}).eq('id',id); load();}
async function editItem(id,nama,stok,pakai){
 let nn=prompt('Nama barang:',nama); if(nn===null) return;
 let ns=prompt('Stok:',stok); if(ns===null) return;
 let np=prompt('Terpakai:',pakai); if(np===null) return;
 await client.from('stok').update({nama_barang:nn,stok:parseInt(ns||0),terpakai:parseInt(np||0)}).eq('id',id); load();
}
load();
</script>
</body>
</html>
