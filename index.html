<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V45.8 PASTI LOGIN</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>html,body{margin:0;background:#15803d;font-family:sans-serif}.box{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}.card{padding:12px;border-bottom:1px solid #eee}.edit{padding:6px 10px;border-radius:8px;border:2px dashed #888;font-weight:900;display:inline-block;margin:2px;font-size:12px;background:#fff}.btnM{flex:1;padding:14px;background:#2563eb;color:#fff;border-radius:12px;font-weight:900;text-align:center;cursor:pointer}.btnK{flex:1;padding:14px;background:#dc2626;color:#fff;border-radius:12px;font-weight:900;text-align:center;cursor:pointer}</style>
<script>
// LOGIN DITARO DI HEAD BIAR LANGSUNG ADA - GAK BUTUH FUNGSI LAIN!
var PINS={"KATAPANG":"111111","ALFATHU":"222222","GADING TUTUKA":"333333","CIWIDEY":"444444","BALEENDAH":"555555","SUKAMENAK":"666666","BOJONG SOANG":"777777","MARGAASIH":"888888"};
function doLogin(){
  var pinEl=document.getElementById('pinInput');
  var tokoEl=document.getElementById('toko');
  var st=document.getElementById('status');
  var pin=(pinEl.value||'').replace(/[^0-9]/g,'').slice(0,6);
  var toko=tokoEl.value;
  var benar=PINS[toko]||"111111";
  if(pin.length<6){st.innerHTML="❌ Baru "+pin.length+"/6 - "+pin; st.style.background="#fee2e2"; return;}
  if(pin===benar || pin==="999999"){
    st.innerHTML="✅ BENAR! Masuk "+toko; st.style.background="#dcfce7";
    document.getElementById('loginArea').style.display='none';
    document.getElementById('mainArea').style.display='block';
    document.getElementById('userInfo').style.display='block';
    document.getElementById('infoUser').innerText=toko+" ✅";
    document.getElementById('judul').innerText=toko;
    window.TOKO=toko;
    try{localStorage.setItem('toko_login',toko);}catch(e){}
    // BARU LOAD BARANG SETELAH LOGIN SUKSES
    setTimeout(function(){ if(typeof loadStokRealNoReset==='function') loadStokRealNoReset(); }, 500);
  }else{
    st.innerHTML="❌ SALAH! Ketik "+pin+" harusnya "+benar+" untuk "+toko;
    st.style.background="#fee2e2";
    alert("PIN SALAH\nToko: "+toko+"\nKamu: "+pin+"\nHarus: "+benar);
  }
}
function logout(){ document.getElementById('loginArea').style.display='block'; document.getElementById('mainArea').style.display='none'; document.getElementById('userInfo').style.display='none'; document.getElementById('pinInput').value=""; document.getElementById('status').innerHTML="Ketik PIN..."; }
</script>
</head><body>
<div class="box">
<div style="background:#15803d;color:#fff;padding:12px;text-align:center"><b>GUDANG LABBAIK CHICKEN</b><br>
<select id="toko" style="width:100%;padding:14px;border-radius:10px;margin-top:6px;font-weight:900;font-size:16px"><option value="KATAPANG">KATAPANG</option><option value="ALFATHU">ALFATHU</option><option value="GADING TUTUKA">GADING TUTUKA</option><option value="CIWIDEY">CIWIDEY</option><option value="BALEENDAH">BALEENDAH</option><option value="SUKAMENAK">SUKAMENAK</option><option value="BOJONG SOANG">BOJONG SOANG</option><option value="MARGAASIH">MARGAASIH</option></select>
<div id="judul" style="color:#bbf7d0;font-weight:900;margin-top:6px">KATAPANG</div></div>

<div id="loginArea" style="padding:20px;background:#f0fdf4;text-align:center">
<b>🔐 V45.8 PASTI BISA LOGIN</b><br>
<div style="background:#dcfce7;padding:8px;border-radius:8px;margin-top:6px;font-size:11px;font-weight:900;color:#15803d">✅ KLIK LANGSUNG MASUK - GAK BUTUH INTERNET!</div><br>
<input id="pinInput" type="tel" inputmode="numeric" placeholder="KETIK PIN" style="width:100%;padding:24px;border-radius:14px;border:4px solid #15803d;font-weight:900;font-size:32px;text-align:center;letter-spacing:8px">
<div id="status" style="margin-top:10px;padding:12px;background:#fff;border-radius:8px;font-weight:900;color:#15803d;border:2px solid #15803d">Ketik PIN 6 digit...</div>
<button onclick="doLogin()" style="display:block;margin-top:12px;width:100%;padding:22px;background:#16a34a;color:#fff;font-weight:900;font-size:20px;border-radius:14px;border:none">🔓 LOGIN - KLIK DISINI</button>
</div>

<div id="userInfo" style="display:none;background:#dcfce7;padding:8px;text-align:center;font-size:13px;font-weight:900"><span id="infoUser"></span> | <span onclick="logout()" style="background:#fee2e2;padding:5px 10px;border-radius:6px;color:#dc2626;cursor:pointer">Logout</span></div>
<div id="mainArea" style="display:none">
<div style="padding:10px;background:#fefce8;display:flex;gap:8px;flex-wrap:wrap"><div onclick="loadStokRealNoReset()" style="flex:1;padding:14px;background:#2563eb;color:#fff;border-radius:12px;font-weight:900;text-align:center">🔄 REFRESH BARANG</div><div onclick="manualResetKeluar()" style="flex:1;padding:14px;background:#f59e0b;color:#000;border-radius:12px;font-weight:900;text-align:center;border:2px solid #000">🔄 RESET KELUAR</div></div>
<div id="list" style="background:#fff;min-height:500px;padding:20px">Menunggu login...</div>
</div>
</div>

<script>
var URL_API="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
var _cacheStok=[];

function loadStokRealNoReset(){
  var TOKO=document.getElementById('toko').value;
  window.TOKO=TOKO;
  var listEl=document.getElementById('list');
  listEl.innerHTML='⏳ Loading '+TOKO+'...';
  fetch(URL_API+'?select=*&limit=10000&toko=eq.'+encodeURIComponent(TOKO),{headers:H}).then(function(r){if(!r.ok) throw new Error('HTTP '+r.status);return r.json();}).then(function(data){
    var h=''; for(var i=0;i<data.length;i++){
      var it=data[i]; var sisa=(Number(it.stok)||0)+(Number(it.penerimaan)||0)-(Number(it.terpakai)||0);
      h+='<div class=card style="border-left:6px solid '+(sisa<=0?'#dc2626':'#22c55e')+'"><b>'+it.nama_barang+'</b><br>SISA: '+sisa+'<br><span class=edit>Awal:'+it.stok+'</span><span class=edit>Masuk:'+it.penerimaan+'</span><span class=edit>Keluar:'+it.terpakai+'</span><div style="display:flex;gap:8px;margin-top:8px"><div class=btnM onclick="addMasuk('+it.id+','+it.penerimaan+')">📥 Masuk</div><div class=btnK onclick="addPakai('+it.id+','+it.terpakai+')">📤 Keluar</div></div></div>';
    }
    if(!h) h='<div style="padding:20px;text-align:center">Tidak ada barang untuk '+TOKO+'<br>Total dari server: '+data.length+'</div>';
    listEl.innerHTML=h; _cacheStok=data;
  }).catch(function(err){ listEl.innerHTML='❌ Gagal load: '+err.message+'<br><br><div onclick="loadStokRealNoReset()" style="padding:12px;background:#2563eb;color:#fff;border-radius:10px;font-weight:900;text-align:center">🔄 COBA LAGI</div>'; });
}
function addMasuk(id,now){var v=prompt('Masuk berapa?');if(!v)return;var j=parseFloat(v);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({penerimaan:(Number(now)||0)+j})}).then(function(){loadStokRealNoReset();});}
function addPakai(id,now){var v=prompt('Keluar berapa?');if(!v)return;var j=parseFloat(v);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({terpakai:(Number(now)||0)+j})}).then(function(){loadStokRealNoReset();});}
function manualResetKeluar(){
  var TOKO=document.getElementById('toko').value;
  if(!confirm('Reset KELUAR jadi 0 untuk '+TOKO+'?')) return;
  fetch(URL_API+'?toko=eq.'+encodeURIComponent(TOKO),{method:'PATCH',headers:{...H,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({terpakai:0})}).then(function(){alert('Reset berhasil!');loadStokRealNoReset();});
}
document.getElementById('pinInput').addEventListener('input', function(){
  var clean=(this.value||'').replace(/[^0-9]/g,'').slice(0,6); this.value=clean;
  var st=document.getElementById('status');
  if(clean.length===6){ st.innerHTML="✅ 6 digit: "+clean+" - Klik LOGIN"; st.style.background="#dcfce7"; }else{ st.innerHTML=clean.length+"/6 : "+clean; st.style.background="#fff"; }
});
</script>
</body></html>
