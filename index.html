<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDANG LABBAIK V9</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto bg-white min-h-screen pb-20">
  <div class="bg-green-700 text-white p-4">
    <h1 class="font-black text-xl text-center">GUDANG LABBAIK V9</h1>
    <p id="status" class="text-center text-[11px] text-yellow-200 mt-1">Menyambung...</p>
  </div>
  <div class="p-3 bg-yellow-50 border-b flex gap-1">
    <input id="nama" placeholder="Nama barang" class="flex-1 p-2 border rounded-lg text-sm">
    <input id="stok" type="number" placeholder="Stok" class="w-16 p-2 border rounded-lg text-sm font-bold text-center">
    <select id="sat" class="w-16 p-2 border rounded-lg text-xs font-bold"><option>kg</option><option>gr</option><option selected>pcs</option><option>ekor</option></select>
    <button onclick="tambah()" class="bg-green-700 text-white px-4 rounded-lg font-black">+</button>
  </div>
  <div id="list" class="p-3 space-y-2">Loading...</div>
</div>
<script>
const URL="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
const HEAD={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};

async function load(){
  try{
    document.getElementById('status').innerText='Load stok...';
    let r=await fetch(URL+"?select=*&order=id.desc",{headers:HEAD});
    if(!r.ok){let t=await r.text();throw new Error(t);}
    let data=await r.json();
    document.getElementById('status').innerText='✅ Terhubung - '+data.length+' barang';
    let html='';
    data.forEach(it=>{
      let s=parseFloat(it.stok)||0; let p=parseFloat(it.terpakai)||0; let sisa=s-p; let sat=it.satuan||'pcs';
      html+=`<div class="bg-white p-3 rounded-xl shadow border-l-4 ${sisa<=2?'border-red-600 bg-red-50':sisa<=5?'border-yellow-500 bg-yellow-50':'border-green-500'}">
        <div class="flex justify-between"><b class="text-sm">${it.nama_barang}</b><button onclick="hapus(${it.id})" class="text-xs">🗑️</button></div>
        <div class="text-[11px] mt-1">Stok Awal: ${s} | Terpakai: ${p} | <b class="text-green-700">SISA: ${sisa} ${sat}</b></div>
        <div class="flex gap-1 mt-2">
          <input type="number" value="${s}" onchange="upd(${it.id},'stok',this.value)" class="w-14 p-1 border rounded text-center text-xs font-bold">
          <input type="number" value="${p}" onchange="upd(${it.id},'terpakai',this.value)" class="w-14 p-1 border-2 border-red-200 bg-red-50 rounded text-center text-xs font-bold">
          <button onclick="pakai(${it.id},${p},1)" class="bg-red-600 text-white px-2 rounded text-xs">-1 Pakai</button>
          <button onclick="pakai(${it.id},${p},-1)" class="bg-green-600 text-white px-2 rounded text-xs">+1 Balik</button>
          <select onchange="upd(${it.id},'satuan',this.value)" class="flex-1 p-1 border rounded text-xs font-bold"><option ${sat=='kg'?'selected':''}>kg</option><option ${sat=='gr'?'selected':''}>gr</option><option ${sat=='pcs'?'selected':''}>pcs</option><option ${sat=='ekor'?'selected':''}>ekor</option></select>
        </div>
      </div>`;
    });
    document.getElementById('list').innerHTML=html||'Kosong';
  }catch(e){document.getElementById('list').innerHTML='<div class="bg-red-100 p-3 rounded text-xs">❌ GAGAL: '+e.message+'<br><br>1. Buka Supabase > SQL > Run:<br>ALTER TABLE public.stok DISABLE ROW LEVEL SECURITY;</div>';}
}
async function upd(id,k,v){let b={};b[k]=k=='satuan'?v:parseFloat(v);await fetch(URL+"?id=eq."+id,{method:'PATCH',headers:HEAD,body:JSON.stringify(b)});load();}
async function pakai(id,now,delta){let baru=now+delta;if(baru<0)baru=0;await fetch(URL+"?id=eq."+id,{method:'PATCH',headers:HEAD,body:JSON.stringify({terpakai:baru})});load();}
async function tambah(){let n=document.getElementById('nama').value.trim();let s=document.getElementById('stok').value||0;let sa=document.getElementById('sat').value;if(!n)return alert('Isi nama!');await fetch(URL,{method:'POST',headers:HEAD,body:JSON.stringify({nama_barang:n,stok:parseFloat(s),terpakai:0,satuan:sa})});document.getElementById('nama').value='';load();}
async function hapus(id){if(confirm('Hapus?')){await fetch(URL+"?id=eq."+id,{method:'DELETE',headers:HEAD});load();}}
load();
</script>
</body>
</html>
