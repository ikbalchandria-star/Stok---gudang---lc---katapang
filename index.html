<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDANG LABBAIK V12.1</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto bg-white min-h-screen pb-24">
  <div class="bg-green-700 text-white p-4 sticky top-0 z-20">
    <h1 class="font-black text-xl text-center">GUDANG LABBAIK</h1>
    <div class="flex justify-center items-center gap-2 mt-1">
      <h2 id="judulToko" class="font-bold text-yellow-300">-</h2><span>🔒</span>
    </div>
    <div id="areaPilih" class="mt-3 hidden">
      <select id="toko" class="w-full p-2.5 rounded-xl text-black font-bold text-sm">
        <option value="KATAPANG">🏪 KATAPANG</option><option value="ALFATHU">🏪 ALFATHU</option><option value="GATUK">🏪 GATUK</option><option value="CIWIDEY">🏪 CIWIDEY</option>
      </select>
      <button onclick="kunciToko()" class="w-full mt-2 bg-yellow-400 text-black p-2 rounded-xl font-black text-sm">🔒 KUNCI TOKO INI DI HP</button>
    </div>
    <div id="areaTerkunci" class="mt-2 text-center">
      <span id="labelToko" class="bg-white text-green-800 px-3 py-1 rounded-full font-black text-sm"></span>
      <div class="flex justify-center gap-3 mt-2 text-[10px]">
        <button onclick="bukaKunci()" class="underline text-yellow-200">🔓 Ganti Toko (PIN)</button>
        <button onclick="gantiPin()" class="underline text-yellow-200">🔑 Ganti PIN</button>
      </div>
    </div>
    <p id="status" class="text-center text-[10px] text-yellow-200 mt-2">✅ Terhubung</p>
  </div>
  <div class="p-3 bg-yellow-50 border-b space-y-2">
    <div class="flex gap-1">
      <input id="nama" placeholder="Nama barang baru" class="flex-1 p-2 border rounded-lg text-sm">
      <input id="stok" type="number" placeholder="Awal" class="w-14 p-2 border rounded-lg text-sm font-bold text-center">
      <select id="sat" class="w-16 p-2 border rounded-lg text-xs font-bold"><option>kg</option><option>gr</option><option selected>pcs</option><option>ekor</option><option>karung</option></select>
      <button onclick="tambah()" class="bg-green-700 text-white px-4 rounded-lg font-black">+</button>
    </div>
    <input id="cari" oninput="load()" placeholder="🔍 Cari barang" class="w-full p-2.5 border rounded-xl text-sm">
  </div>
  <div id="list" class="p-3 space-y-3">Loading...</div>
</div>
<script>
const URL="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
const HEAD={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
const PIN_MASTER="9999";
function getPinToko(t){return localStorage.getItem('pin_'+t)||'1234';}
function setPinToko(t,p){localStorage.setItem('pin_'+t,p);}
let tokoAktif=localStorage.getItem('toko_labbaik');
let terkunci=localStorage.getItem('toko_terkunci')==='1';
function init(){
  if(!tokoAktif){document.getElementById('areaPilih').classList.remove('hidden');document.getElementById('areaTerkunci').classList.add('hidden');document.getElementById('judulToko').innerText='PILIH TOKO';}
  else{
    document.getElementById('toko').value=tokoAktif;
    if(terkunci){document.getElementById('areaPilih').classList.add('hidden');document.getElementById('areaTerkunci').classList.remove('hidden');document.getElementById('labelToko').innerText='🏪 '+tokoAktif+' - TERKUNCI 🔒';document.getElementById('judulToko').innerText=tokoAktif;}
    else{document.getElementById('areaPilih').classList.remove('hidden');document.getElementById('areaTerkunci').classList.add('hidden');document.getElementById('judulToko').innerText=tokoAktif;}
  }load();
}
function kunciToko(){let t=document.getElementById('toko').value;localStorage.setItem('toko_labbaik',t);localStorage.setItem('toko_terkunci','1');tokoAktif=t;terkunci=true;init();}
function bukaKunci(){let pin=prompt('Masukkan PIN toko '+tokoAktif+':');if(pin===getPinToko(tokoAktif)||pin===PIN_MASTER){localStorage.setItem('toko_terkunci','0');terkunci=false;document.getElementById('areaPilih').classList.remove('hidden');document.getElementById('areaTerkunci').classList.add('hidden');}else if(pin!==null){alert('PIN salah!');}}
function gantiPin(){let pinLama=prompt('PIN lama '+tokoAktif+':');if(pinLama!==getPinToko(tokoAktif)&&pinLama!==PIN_MASTER){if(pinLama!==null)alert('PIN lama salah!');return;}let pinBaru=prompt('PIN BARU 4 digit:');if(!pinBaru||pinBaru.length<4)return alert('Minimal 4 digit!');let k=prompt('Ulangi PIN BARU:');if(pinBaru!==k)return alert('Tidak sama!');setPinToko(tokoAktif,pinBaru);alert('✅ PIN '+tokoAktif+' jadi '+pinBaru);}
function getStatus(sisa,sat){
  sat=(sat||'pcs').toLowerCase();
  if(sat==='pcs'||sat==='ekor'){
    if(sisa<=10) return {t:'🚨 KRISIS',c:'border-red-600 bg-red-50'};
    if(sisa<=25) return {t:'⚠️ MENIPIS',c:'border-yellow-500 bg-yellow-50'};
    if(sisa>=100) return {t:'📦 OVER',c:'border-blue-500 bg-blue-50'};
    return {t:'✅ Aman',c:'border-green-500 bg-white'};
  } else if(sat==='kg'){
    if(sisa<=5) return {t:'🚨 KRISIS',c:'border-red-600 bg-red-50'};
    if(sisa<=10) return {t:'⚠️ MENIPIS',c:'border-yellow-500 bg-yellow-50'};
    if(sisa>=50) return {t:'📦 OVER',c:'border-blue-500 bg-blue-50'};
    return {t:'✅ Aman',c:'border-green-500 bg-white'};
  } else if(sat==='gr'){
    if(sisa<=1000) return {t:'🚨 KRISIS',c:'border-red-600 bg-red-50'};
    if(sisa<=3000) return {t:'⚠️ MENIPIS',c:'border-yellow-500 bg-yellow-50'};
    if(sisa>=20000) return {t:'📦 OVER',c:'border-blue-500 bg-blue-50'};
    return {t:'✅ Aman',c:'border-green-500 bg-white'};
  } else {
    if(sisa<=2) return {t:'🚨 KRISIS',c:'border-red-600 bg-red-50'};
    if(sisa<=5) return {t:'⚠️ MENIPIS',c:'border-yellow-500 bg-yellow-50'};
    if(sisa>=20) return {t:'📦 OVER',c:'border-blue-500 bg-blue-50'};
    return {t:'✅ Aman',c:'border-green-500 bg-white'};
  }
}
async function load(){
  let r=await fetch(URL+"?select=*&order=id.desc",{headers:HEAD});
  let data=await r.json();
  let q=(document.getElementById('cari').value||'').toLowerCase();
  let filtered=data.filter(it=>{
    let cocokCari=!q||(it.nama_barang||'').toLowerCase().includes(q);
    let cocokToko=!tokoAktif||(it.toko||'KATAPANG')==tokoAktif;
    return cocokCari&&cocokToko;
  });
  document.getElementById('status').innerText=`✅ ${filtered.length} barang di ${tokoAktif||'-'}`;
  let html='';
  filtered.forEach(it=>{
    let stok=parseFloat(it.stok)||0; let masuk=parseFloat(it.penerimaan)||0; let pakai=parseFloat(it.terpakai)||0; let sisa=stok+masuk-pakai; let sat=it.satuan||'pcs';
    let st=getStatus(sisa,sat);
    html+=`<div class="bg-white p-3 rounded-xl shadow border-l-4 ${st.c}">
      <div class="flex justify-between"><b class="text-sm">${it.nama_barang}</b><span class="text-[9px] bg-gray-100 px-2 py-1 rounded-full">${it.toko||'KATAPANG'}</span></div>
      <div class="text-[11px] mt-1">Awal: ${stok} | Masuk: <span class="text-blue-600 font-bold">${masuk}</span> | Pakai: ${pakai} | <b class="text-green-700">SISA: ${sisa} ${sat}</b> - ${st.t}</div>
      <div class="mt-2 space-y-1.5">
        <div class="flex items-center gap-1">
          <span class="w-16 text-[10px] font-bold">AWAL</span>
          <button onclick="updMinus('stok',${it.id},${stok})" class="w-8 h-8 bg-gray-200 rounded-lg font-black">-</button>
          <input type="number" value="${stok}" onchange="upd(${it.id},'stok',this.value)" class="flex-1 p-1.5 border rounded text-center text-xs font-bold">
          <button onclick="updPlus('stok',${it.id},${stok})" class="w-8 h-8 bg-gray-800 text-white rounded-lg font-black">+</button>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-16 text-[10px] font-bold text-blue-600">MASUK</span>
          <button onclick="updMinus('penerimaan',${it.id},${masuk})" class="w-8 h-8 bg-blue-100 text-blue-700 rounded-lg font-black">-</button>
          <input type="number" value="${masuk}" onchange="upd(${it.id},'penerimaan',this.value)" class="flex-1 p-1.5 border-2 border-blue-200 bg-blue-50 rounded text-center text-xs font-bold">
          <button onclick="updPlus('penerimaan',${it.id},${masuk})" class="w-8 h-8 bg-blue-600 text-white rounded-lg font-black">+</button>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-16 text-[10px] font-bold text-red-600">PAKAI</span>
          <button onclick="updMinus('terpakai',${it.id},${pakai})" class="w-8 h-8 bg-red-100 text-red-700 rounded-lg font-black">-</button>
          <input type="number" value="${pakai}" onchange="upd(${it.id},'terpakai',this.value)" class="flex-1 p-1.5 border-2 border-red-200 bg-red-50 rounded text-center text-xs font-bold">
          <button onclick="updPlus('terpakai',${it.id},${pakai})" class="w-8 h-8 bg-red-600 text-white rounded-lg font-black">+</button>
        </div>
      </div>
      <div class="mt-2"><select onchange="upd(${it.id},'satuan',this.value)" class="w-full p-1 border rounded text-xs font-bold"><option ${sat=='kg'?'selected':''}>kg</option><option ${sat=='gr'?'selected':''}>gr</option><option ${sat=='pcs'?'selected':''}>pcs</option><option ${sat=='ekor'?'selected':''}>ekor</option><option ${sat=='karung'?'selected':''}>karung</option></select></div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html||'<div class="text-center p-5 text-sm">Belum ada barang</div>';
}
async function upd(id,k,v){let b={};b[k]=k=='satuan'?v:parseFloat(v);await fetch(URL+"?id=eq."+id,{method:'PATCH',headers:HEAD,body:JSON.stringify(b)});load();}
async function updPlus(k,id,now){let baru=now+1;let b={};b[k]=baru;await fetch(URL+"?id=eq."+id,{method:'PATCH',headers:HEAD,body:JSON.stringify(b)});load();}
async function updMinus(k,id,now){let baru=now-1;if(baru<0)baru=0;let b={};b[k]=baru;await fetch(URL+"?id=eq."+id,{method:'PATCH',headers:HEAD,body:JSON.stringify(b)});load();}
async function tambah(){let n=document.getElementById('nama').value.trim();let s=document.getElementById('stok').value||0;let sa=document.getElementById('sat').value;if(!n)return alert('Isi nama!');if(!tokoAktif)return alert('Pilih toko dulu!');await fetch(URL,{method:'POST',headers:HEAD,body:JSON.stringify({nama_barang:n,stok:parseFloat(s),penerimaan:0,terpakai:0,satuan:sa,toko:tokoAktif})});document.getElementById('nama').value='';load();}
init();
</script>
</body>
</html>
