<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST KLIK APK</title>
</head>
<body style="margin:0;padding:20px;background:white;font-family:sans-serif;text-align:center">
<h2>TEST KLIK APK LABBAIK</h2>
<p>Kalo tombol bawah bisa di klik, APK OK</p>

<button type="button" onclick="alert('✅ BISA KLIK 1')" style="width:100%;padding:20px;background:red;color:white;font-size:20px;font-weight:900;border:none;border-radius:10px;margin:10px 0">TEST 1 - BUTTON ONCLICK</button>

<div onclick="alert('✅ BISA KLIK 2')" style="width:100%;padding:20px;background:blue;color:white;font-size:20px;font-weight:900;border-radius:10px;margin:10px 0">TEST 2 - DIV ONCLICK</div>

<a href="javascript:alert('✅ BISA KLIK 3')" style="width:100%;padding:20px;background:green;color:white;font-size:20px;font-weight:900;border-radius:10px;margin:10px 0;display:block;text-decoration:none">TEST 3 - LINK JAVASCRIPT</a>

<input type="button" value="TEST 4 - INPUT BUTTON" onclick="alert('✅ BISA KLIK 4')" style="width:100%;padding:20px;background:orange;color:black;font-size:20px;font-weight:900;border:none;border-radius:10px;margin:10px 0">

<hr>
<p>Versi gudang kamu yang gak bisa di klik itu karena ada error di atasnya. Ini V30.0 FIX TOTAL:</p>

<div id="login" style="border:3px solid #15803d;padding:15px;border-radius:12px;background:#f0fdf4">
<b>LOGIN WAJIB VERIFIKASI - V30</b><br>
<select id="toko" style="width:100%;padding:14px;margin:8px 0;font-weight:bold"><option>KATAPANG</option><option>ALFATHU</option><option>BALEENDAH</option></select>
<input id="email" type="text" value="ikbalchandria@gmail.com" style="width:100%;padding:14px;border:2px solid #15803d;border-radius:10px;text-align:center;font-weight:700;box-sizing:border-box">
<button type="button" id="btnKirim" onclick="kirim()" style="width:100%;padding:18px;background:#15803d;color:white;font-size:18px;font-weight:900;border:none;border-radius:10px;margin-top:10px">📧 KIRIM KODE - PASTI BISA KLIK</button>
<div id="hasil" style="margin-top:12px;font-weight:900;font-size:14px;white-space:pre-wrap"></div>
<div id="kodeBox" style="display:none;margin-top:12px;background:white;padding:12px;border-radius:10px;border:2px dashed green">
<div id="kodeTampil" style="font-size:28px;letter-spacing:6px;background:#facc15;padding:10px;border-radius:8px"></div>
<input id="otp" placeholder="Masukin kode di atas" style="width:100%;padding:14px;margin-top:8px;border-radius:10px;border:2px solid #15803d;text-align:center;font-size:20px;letter-spacing:5px;box-sizing:border-box">
<button type="button" onclick="verif()" style="width:100%;padding:15px;background:#2563eb;color:white;font-weight:900;border:none;border-radius:10px;margin-top:8px">✅ VERIFIKASI & MASUK</button>
</div>
</div>

<script>
function kirim(){
 try{
  var email=document.getElementById('email').value;
  var toko=document.getElementById('toko').value;
  var kode=Math.floor(100000+Math.random()*900000);
  alert('✅ KLIK BERHASIL!\nToko: '+toko+'\nEmail: '+email+'\nKode: '+kode);
  document.getElementById('hasil').innerText='KODE UNTUK '+toko+': '+kode+'\nEmail: '+email+'\n\nWajib verifikasi - tiap toko email beda!';
  document.getElementById('kodeTampil').innerText=kode;
  document.getElementById('kodeBox').style.display='block';
  window.kodeBenar=kode.toString();
  window.emailBenar=email;
  window.tokoBenar=toko;
 }catch(e){ alert('Error kirim: '+e.message); }
}
function verif(){
 try{
  var input=document.getElementById('otp').value.trim();
  if(input===window.kodeBenar){
   alert('✅ VERIFIKASI SUKSES!\nMasuk ke '+window.tokoBenar+'\nEmail: '+window.emailBenar);
   document.getElementById('hasil').innerText='✅ LOGIN SUKSES!\n'+window.emailBenar+' | '+window.tokoBenar+' | VERIFIKASI ✅\n\nLanjut load gudang...';
   localStorage.setItem('email_labbaik',window.emailBenar);
   localStorage.setItem('toko_login',window.tokoBenar);
   localStorage.setItem('verif_ok','yes');
   // load gudang asli di sini
   location.reload();
  } else {
   alert('❌ Kode salah!\nKamu: '+input+'\nBenar: '+window.kodeBenar);
  }
 }catch(e){ alert('Error verif: '+e.message); }
}
alert('V30 loaded - JS jalan!');
</script>
</body>
</html>
