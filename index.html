<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDANG LABBAIK CHICKEN</title>
<style>
html,body{margin:0;padding:0;background:#15803d;font-family:sans-serif}
.box{max-width:480px;margin:0 auto;background:white;min-height:100vh}
.header{padding:12px;background:#15803d;color:white;text-align:center}
.card{border:1px solid #ddd;margin:8px;padding:12px;border-radius:14px;border-left:5px solid #22c55e;background:white}
.u{padding:5px 8px;border-radius:8px;border:1px dashed #aaa;font-weight:bold;display:inline-block;margin:2px;font-size:12px;cursor:pointer}
.tombol{padding:14px;border-radius:10px;font-weight:900;text-align:center;border:none;width:100%;box-sizing:border-box;font-size:14px;display:block;cursor:pointer}
.loginBox{background:#f0fdf4;border:2px solid #15803d;margin:10px;padding:16px;border-radius:14px;text-align:center}
.inp{width:100%;padding:13px;border-radius:10px;border:2px solid #15803d;font-weight:700;font-size:15px;box-sizing:border-box;margin:6px 0;text-align:center}
</style>
</head>
<body>
<div class="box">
<div class="header">
<b>GUDANG LABBAIK CHICKEN</b><br>
<span id="judul" style="color:#bbf7d0;font-weight:900;font-size:18px">KATAPANG</span><br>
<select id="toko" onchange="gantiToko(this.value)" style="width:100%;padding:13px;border-radius:10px;margin-top:8px;font-weight:bold">
<option value="KATAPANG">KATAPANG</option><option value="ALFATHU">ALFATHU</option><option value="GADING TUTUKA">GADING TUTUKA</option><option value="CIWIDEY">CIWIDEY</option><option value="BALEENDAH">BALEENDAH</option><option value="SUKAMENAK">SUKAMENAK</option><option value="BOJONG SOANG">BOJONG SOANG</option><option value="MARGAASIH">MARGAASIH</option>
</select>
</div>

<div id="loginArea" class="loginBox">
<b>🔐 LOGIN VERIFIKASI WAJIB</b>
<div style="font-size:11px;color:#555;margin:6px 0">Wajib verifikasi kode ke email toko <b id="namaTokoLogin">KATAPANG</b></div>
<input id="emailInput" type="email" class="inp" placeholder="email toko KATAPANG">
<button id="btnKirim" onclick="kirimOTP()" style="width:100%;background:#15803d;color:white;padding:14px;border-radius:10px;border:none;font-weight:900;font-size:15px;margin-top:8px">📧 KIRIM KODE VERIFIKASI</button>

<div id="otpArea" style="display:none;margin-top:14px;border-top:2px dashed #22c55e;padding-top:12px">
<div style="font-size:12px">Kode dikirim ke <b id="emailTampil"></b><br><span style="font-size:10px">Cek Gmail / Spam - kadang 1-2 menit</span></div>
<input id="otpInput" class="inp" placeholder="123456" maxlength="6" style="letter-spacing:6px;font-size:22px">
<button id="btnVerif" onclick="verifOTP()" style="width:100%;background:#2563eb;color:white;padding:14px;border-radius:10px;border:none;font-weight:900;margin-top:6px">✅ VERIFIKASI & MASUK</button>
<button onclick="batalOTP()" style="width:100%;background:#eee;padding:9px;border-radius:8px;border:none;font-size:11px;margin-top:6px">Ganti Email / Kirim Ulang</button>
</div>

<div id="msgLogin" style="font-size:11px;color:#dc2626;margin-top:10px;white-space:pre-wrap"></div>
<div style="margin-top:10px;font-size:10px;color:#666;background:#fef9c3;padding:8px;border-radius:8px">
⚠️ Kalo muncul <b>rate limit exceeded</b> = kebanyakan kirim. Tunggu 60 menit, atau pakai kode cadangan di bawah yang muncul otomatis.
</div>
</div>

<div id="userInfo" style="display:none;background:#dcfce7;padding:9px;text-align:center;font-size:11px;font-weight:900">
<span id="infoUser"></span> <button onclick="logout()" style="background:#fee2e2;border:none;padding:5px 10px;border-radius:6px;font-size:11px;margin-left:8px">🚪 Logout</button>
</div>

<div id="mainArea" style="display:none">
<div style="padding:10px;background:#fef9c3">
<div style="display:flex;gap:6px"><input type="file" id="fileExcel" accept=".xlsx,.xls" style="display:none"><button class="tombol" onclick="document.getElementById('fileExcel').click()" style="flex:1;background:#2563eb;color:white">📂 IMPORT EXCEL</button><button class="tombol" onclick="exportExcel()" style="flex:1;background:#16a34a;color:white">📤 EXPORT EXCEL</button></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="namaBaru" placeholder="Nama barang baru" style="flex:1;padding:11px;border-radius:10px;border:1px solid #ccc;font-weight:bold"><input id="stokBaru" type="number" placeholder="Awal" style="width:60px;padding:11px;border-radius:10px;border:1px solid #ccc;text-align:center;font-weight:900"><select id="satBaru" style="width:65px;padding:11px;border-radius:10px;border:1px solid #ccc;font-weight:900"><option>gr</option><option>kg</option><option selected>pcs</option><option>ekor</option><option>karung</option></select><button class="tombol" onclick="tambah()" style="background:#15803d;color:white;width:55px">+</button></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="cari" oninput="load()" placeholder="🔍 Cari barang..." style="flex:1;padding:11px;border-radius:10px;border:1px solid #ccc"><button class="tombol" onclick="resetHarian()" style="background:#facc15;color:black;width:85px;font-size:11px">🔄 RESET</button></div>
</div>
<div id="list" style="padding:6px;background:#f0f0f0;min-height:400px">Loading...</div>
</div>
</div>

<script>
var URL_API="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
var URL_AUTH="https://lgunwtgwlzggfmfjzxqm.supabase.co/auth/v1";
var toko="KATAPANG"; var emailLogin="";

var defaultEmails={
 "KATAPANG":"katapang@labbaikchicken.com",
 "ALFATHU":"alfathu@labbaikchicken.com",
 "GADING TUTUKA":"gadingtutuka@labbaikchicken.com",
 "CIWIDEY":"ciwidey@labbaikchicken.com",
 "BALEENDAH":"baleendah@labbaikchicken.com",
 "SUKAMENAK":"sukamenak@labbaikchicken.com",
 "BOJONG SOANG":"bojongsoang@labbaikchicken.com",
 "MARGAASIH":"margaasih@labbaikchicken.com"
};

function getEmailToko(t){ try{var s=JSON.parse(localStorage.getItem('emails_toko')||'{}'); if(s[t]) return s[t];}catch(e){} return defaultEmails[t]||''; }

function gantiToko(v){
 toko=v;
 document.getElementById('judul').innerText=v;
 document.getElementById('namaTokoLogin').innerText=v;
 document.getElementById('emailInput').value=getEmailToko(v);
 document.getElementById('otpArea').style.display='none';
 document.getElementById('msgLogin').innerText='Email '+v+' = '+getEmailToko(v)+' - WAJIB verifikasi';
 try{localStorage.setItem('toko_labbaik',v);}catch(e){}
}

function checkLogin(){
 try{
  var em=localStorage.getItem('email_labbaik');
  var tk=localStorage.getItem('toko_login');
  var verif=localStorage.getItem('verif_ok');
  if(em && tk===toko && verif==='yes'){
   document.getElementById('loginArea').style.display='none';
   document.getElementById('userInfo').style.display='block';
   document.getElementById('mainArea').style.display='block';
   document.getElementById('infoUser').innerText=em+' | '+toko+' | VERIFIKASI ✅';
   return true;
  }
 }catch(e){}
 document.getElementById('loginArea').style.display='block';
 document.getElementById('userInfo').style.display='none';
 document.getElementById('mainArea').style.display='none';
 document.getElementById('emailInput').value=getEmailToko(toko);
 return false;
}

function buatKode(){ return Math.floor(100000+Math.random()*900000).toString(); }

function kirimOTP(){
 var email=document.getElementById('emailInput').value.trim();
 if(!email||email.indexOf('@')==-1){ document.getElementById('msgLogin').innerText='Email toko harus ada @'; return; }
 emailLogin=email;
 document.getElementById('btnKirim').innerText='⏳ Mengirim ke '+email+'...';
 document.getElementById('msgLogin').innerText='';

 var kodeLokal=buatKode();
 var waktu=Date.now();
 try{ localStorage.setItem('otp_lokal',kodeLokal); localStorage.setItem('otp_email',email); localStorage.setItem('otp_toko',toko); localStorage.setItem('otp_waktu',waktu.toString()); }catch(e){}

 fetch(URL_AUTH+'/otp',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({email:email,options:{shouldCreateUser:true}})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(res){
  document.getElementById('btnKirim').innerText='📧 KIRIM KODE VERIFIKASI';
  document.getElementById('emailTampil').innerText=email;
  document.getElementById('otpArea').style.display='block';
  if(res.ok){
   document.getElementById('msgLogin').innerHTML='✅ Kode OTP dikirim ke:<br><b>'+email+'</b><br>Toko: '+toko+'<br><br>Cek Gmail / Spam!<br><br><small>Kode cadangan (jika email lama): <b>'+kodeLokal+'</b></small>';
  } else {
   var err=(res.j.error_description||res.j.msg||'');
   if(err.indexOf('rate limit')>=0){
    document.getElementById('msgLogin').innerHTML='⛔ RATE LIMIT! Kebanyakan kirim ke '+email+'<br>Tunggu 60 menit atau pakai kode cadangan:<br><br><b style="font-size:24px;background:#facc15;padding:10px 18px;border-radius:10px;letter-spacing:4px">'+kodeLokal+'</b><br><br>Masukkan kode di atas untuk masuk sebagai '+toko+'<br><small>Kode ini sah untuk toko '+toko+' saja</small>';
   } else {
    document.getElementById('msgLogin').innerHTML='⚠️ Supabase: '+err+'<br><br>Tapi kamu tetap bisa masuk pakai kode cadangan:<br><b style="font-size:24px;background:#facc15;padding:10px 18px;border-radius:10px">'+kodeLokal+'</b>';
   }
  }
 }).catch(function(e){
  document.getElementById('btnKirim').innerText='📧 KIRIM KODE VERIFIKASI';
  document.getElementById('emailTampil').innerText=email;
  document.getElementById('otpArea').style.display='block';
  document.getElementById('msgLogin').innerHTML='Kode verifikasi untuk '+toko+':<br><b style="font-size:24px;background:#facc15;padding:10px 18px;border-radius:10px">'+kodeLokal+'</b><br>Email: '+email+'<br><br>Masukkan kode di atas';
 });
}

function verifOTP(){
 var otp=document.getElementById('otpInput').value.trim();
 if(otp.length<6){ document.getElementById('msgLogin').innerText='Kode harus 6 digit'; return; }
 var kodeLokal=null, emailSimpan=null, tokoSimpan=null;
 try{ kodeLokal=localStorage.getItem('otp_lokal'); emailSimpan=localStorage.getItem('otp_email'); tokoSimpan=localStorage.getItem('otp_toko'); }catch(e){}
