<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LABBAIK V19.2 FIX KLIK 100%</title>
<style>
body{margin:0;font-family:sans-serif;background:#15803d;padding:12px}
.box{max-width:400px;margin:auto;background:white;border-radius:16px;padding:16px}
button{width:100%;padding:18px;border-radius:12px;border:none;font-weight:900;font-size:16px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h3 style="text-align:center;margin:0">GUDANG LABBAIK CHICKEN<br><small style="color:green">V19.2 FIX KLIK</small></h3>

<label>Pilih Toko:</label>
<select id="toko" style="width:100%;padding:16px;border-radius:12px;margin-top:8px;font-weight:bold;border:2px solid #15803d">
<option value="KATAPANG">KATAPANG</option>
<option value="ALFATHU">ALFATHU</option>
<option value="GADING TUTUKA">GADING TUTUKA</option>
<option value="CIWIDEY">CIWIDEY</option>
<option value="BALEENDAH">BALEENDAH</option>
<option value="SUKAMENAK">SUKAMENAK</option>
<option value="BOJONG SOANG">BOJONG SOANG</option>
</select>

<button onclick="tesKlik()" style="background:#facc15;color:black">🔒 KUNCI & BUAT PIN (TES KLIK)</button>
<button onclick="buatPinBaru()" style="background:#15803d;color:white">✅ BIKIN PIN BARU</button>
<button onclick="masukPin()" style="background:#2563eb;color:white">🔓 MASUK PAKAI PIN</button>

<div id="status" style="margin-top:16px;padding:12px;background:#f0f0f0;border-radius:12px;font-size:13px">Status: Siap...<br>Pencet tombol di atas buat tes</div>

<div id="list" style="margin-top:12px"></div>
</div>

<script>
// TANPA CDN - DIJAMIN KLIK JALAN
const URL_SUPA="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
const H={"apikey":KEY,"Authorization":"Bearer "+KEY};

function log(msg){
 document.getElementById('status').innerHTML = msg + "<br><small>" + new Date().toLocaleTimeString() + "</small>";
 console.log(msg);
}

function tesKlik(){
 log("✅ TOMBOL BISA DI KLIK! JavaScript jalan normal. Sekarang coba BIKIN PIN BARU di bawahnya.");
 alert("TOMBOL BISA! Sekarang pencet BIKIN PIN BARU");
}

function getToko(){return document.getElementById('toko').value;}
function getPin(t){return localStorage.getItem('pin_'+t);}
function setPin(t,p){localStorage.setItem('pin_'+t,p); localStorage.setItem('toko_labbaik',t); localStorage.setItem('login_'+t,'1');}

function buatPinBaru(){
 let t=getToko();
 let lama=getPin(t);
 if(lama){
   let cek=prompt("PIN lama "+t+" (Master 9999):");
   if(cek!==lama && cek!=="9999") return alert("Salah!");
 }
 let p1=prompt("Bikin PIN baru untuk "+t+" (4 digit):");
 if(!p1||p1.length<4) return alert("Minimal 4!");
 let p2=prompt("Ulangi PIN:");
 if(p1!==p2) return alert("Gak sama!");
 setPin(t,p1);
 log("✅ PIN "+t+" jadi: "+p1+"<br>Refresh gak akan minta lagi. Coba pencet MASUK PAKAI PIN");
 alert("PIN "+t+" jadi "+p1);
 load();
}

function masukPin(){
 let t=getToko();
 let pin=getPin(t);
 if(!pin) return alert("Belum ada PIN untuk "+t+"! Bikin dulu.");
 let p=prompt("Masukkan PIN "+t+" (Master 9999):");
 if(p===pin || p==="9999"){
   localStorage.setItem('login_'+t,'1');
   localStorage.setItem('toko_labbaik',t);
   log("✅ LOGIN BERHASIL "+t+"<br>Memuat barang...");
   load();
 } else alert("PIN Salah!");
}

async function load(){
 let t=getToko();
 if(!localStorage.getItem('login_'+t)) return log("Belum login "+t);
 log("Loading barang "+t+"...");
 try{
   let r=await fetch(URL_SUPA+"?select=*&limit=20&toko=eq."+t,{headers:H});
   let data=await r.json();
   let html="<b>Barang di "+t+": "+data.length+"</b><br>";
   data.slice(0,10).forEach(it=>{
     let sisa=(+it.stok||0)+(+it.penerimaan||0)-(+it.terpakai||0);
     // KRISIS KHUSUS
     let nama=(it.nama_barang||"").toLowerCase();
     let isPotongan = nama.includes("potongan kecil")||nama.includes("potong kecil")||nama.includes("potongan besar")||nama.includes("potong besar");
     let status="";
     if(isPotongan){
       if(sisa<=300) status="🚨 KRISIS (300)";
       else status="✅ Aman";
     } else {
       if(sisa<=10) status="🚨 KRISIS";
       else status="✅ Aman";
     }
     html+=`<div style="background:white;padding:8px;margin:6px 0;border-radius:8px;border-left:4px solid green"><b>${it.nama_barang}</b><br>Sisa: ${sisa} ${it.satuan||"pcs"} - ${status}</div>`;
   });
   document.getElementById('list').innerHTML=html;
   log("✅ Berhasil load "+data.length+" barang di "+t);
 }catch(e){ log("❌ Gagal: "+e.message); }
}

// AUTO INIT
let saved=localStorage.getItem('toko_labbaik');
if(saved) document.getElementById('toko').value=saved;
log("Siap. Toko terpilih: "+getToko()+"<br>1. Pencet TES KLIK dulu<br>2. Kalo bisa, pencet BIKIN PIN BARU");
</script>
</body>
</html>
