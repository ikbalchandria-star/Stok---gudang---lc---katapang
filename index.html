<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDANG LABBAIK KATAPANG</title>
<link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>body{font-family:system-ui;padding:12px;background:#f2f2f2;margin:0}.header{display:flex;align-items:center;gap:12px;background:#111;padding:12px 16px;border-radius:16px;color:#fff}.header img{width:52px;height:52px;border-radius:12px;background:#FFB800}.status{background:#fff;padding:12px;border-radius:12px;font-weight:700;border:1px solid #ddd;margin-bottom:10px}.row{display:flex;gap:6px;margin-bottom:10px}input{flex:1;padding:14px;border-radius:12px;border:1px solid #ddd}input.small{flex:.6}button.main{width:100%;padding:16px;background:#FFB800;border:0;border-radius:12px;font-weight:900}.item{background:#fff;padding:12px;border-radius:14px;margin:10px 0}.btn{border:0;padding:10px 14px;border-radius:10px;font-weight:800;color:#fff;font-size:13px}.btn-plus{background:#00c853}.btn-minus{background:#ff6d00}.btn-edit{background:#2962ff}.btn-del{background:#111}.top{display:flex;justify-content:space-between}.sisa{color:#00c853;font-weight:900}.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}</style>
</head><body>
<div class="header">
<img src="https://i.ibb.co/3mW5y7j8/logo-labbaik.png"
onerror="this.src='https://via.placeholder.com/52/FFB800/111?text=GL'"
alt="logo" style="width:52px;height:52px;border-radius:12px">
<div><b style="font-size:20px">GUDANG LABBAIK</b><br><small style="letter-spacing:3px">KATAPANG</small></div>
</div>
<div class="status" id="status">⏳ Connecting...</div>
<div class="row"><input id="nama" placeholder="Nama barang"><input id="stok" class="small" type="number" placeholder="Stok"><input id="pakai" class="small" type="number" placeholder="Pakai"></div>
<button class="main" onclick="tambah()">+ Tambah Barang</button>
<div id="list"></div>
<script>
const client=supabase.createClient("https://lgunwtgwlzggfmfjzxqm.supabase.co","sb_publishable_9cBL507qhMKrDzofjIow-A_Y0d4Tesk");
async function load(){let r=await client.from('stok').select('*').order('id',{ascending:false});document.getElementById('status').innerHTML='✅ GUDANG LABBAIK - '+(r.data?.length||0)+' barang';let h='';(r.data||[]).forEach(x=>{let s=(x.stok||0)-(x.terpakai||0);h+=`<div class="item"><div class="top"><div><b>${x.nama_barang}</b><br><small>Stok:${x.stok} Pakai:${x.terpakai} <b class="sisa">Sisa:${s}</b></small></div><button class="btn btn-del" onclick="hapus(${x.id})">Hapus</button></div><div class="controls"><button class="btn btn-plus" onclick="ubah(${x.id},'stok',${x.stok},1)">+ Stok</button><button class="btn btn-minus" onclick="ubah(${x.id},'stok',${x.stok},-1)">- Stok</button><button class="btn btn-plus" onclick="ubah(${x.id},'terpakai',${x.terpakai},1)">+ Pakai</button><button class="btn btn-minus" onclick="ubah(${x.id},'terpakai',${x.terpakai},-1)">- Pakai</button></div></div>`});document.getElementById('list').innerHTML=h}
async function tambah(){let n=nama.value.trim(),s=parseInt(stok.value||0),p=parseInt(pakai.value||0);if(!n)return alert('isi nama');await client.from('stok').insert([{nama_barang:n,stok:s,terpakai:p}]);nama.value=stok.value=pakai.value='';load()}
async function hapus(id){if(!confirm('hapus?'))return;await client.from('stok').delete().eq('id',id);load()}
async function ubah(id,k,v,d){let nv=v+d;if(nv<0)nv=0;let o={};o[k]=nv;await client.from('stok').update(o).eq('id',id);load()}
load();
</script></body></html>
