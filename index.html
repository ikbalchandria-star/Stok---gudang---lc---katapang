<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDANG LABBAIK CHICKEN</title>
<style>
html,body{margin:0;padding:0;background:#15803d;font-family:sans-serif}
.box{max-width:480px;margin:0 auto;background:white;min-height:100vh}
.header{padding:12px;background:#15803d;color:white;text-align:center}
.card{border:1px solid #ddd;margin:8px;padding:12px;border-radius:14px;border-left:5px solid #22c55e;background:white}

.inp{width:100%;padding:13px;border-radius:10px;border:2px solid #15803d;font-weight:700;font-size:15px;box-sizing:border-box;margin:6px 0;text-align:center}
</style>
</head>
<body>
<div class="box">
<div class="header">
<b>GUDANG LABBAIK CHICKEN</b><br>
<span id="judul" style="color:#bbf7d0;font-weight:900;font-size:18px">KATAPANG</span><br>
<select id="toko" onchange="gantiToko(this.value)" style="width:100%;padding:13px;border-radius:10px;margin-top:8px;font-weight:bold;font-size:15px">

</select>
</div>

<div id="loginArea" class="loginBox">
<b>🔐 LOGIN <span id="namaTokoLogin">KATAPANG</span></b>
<div style="font-size:12px;color:#555;margin:6px 0">Masukkan email toko <b id="tokoEmailLabel">KATAPANG</b></div>
<input id="emailInput" type="email" class="inp" placeholder="email toko">
<button onclick="login()" style="width:100%;background:#15803d;color:white;padding:14px;border-radius:10px;border:none;font-weight:900;font-size:16px;margin-top:8px">🔐 LOG IN</button>
<div style="display:flex;gap:6px;margin-top:8px">
<button onclick="simpanEmailToko()" style="flex:1;background:#facc15;color:black;padding:9px;border-radius:8px;border:none;font-weight:900;font-size:10px">💾 SIMPAN EMAIL TOKO INI</button>
<button onclick="editDaftarEmail()" style="flex:1;background:#eee;padding:9px;border-radius:8px;border:none;font-size:10px">📋 LIHAT EMAIL SEMUA TOKO</button>
</div>
<div id="msgLogin" style="font-size:11px;color:#15803d;margin-top:8px"></div>
<div id="daftarEmail" style="display:none;text-align:left;background:white;padding:10px;border-radius:8px;margin-top:10px;font-size:11px;border:1px solid #ddd"></div>
</div>

<div id="userInfo" style="display:none;background:#dcfce7;padding:9px;text-align:center;font-size:11px;font-weight:900">
<span id="infoUser"></span> <button onclick="logout()" style="background:#fee2e2;border:none;padding:5px 10px;border-radius:6px;font-size:11px;margin-left:8px">🚪 Logout</button>
</div>

<div id="mainArea" style="display:none">
<div style="padding:10px;background:#fef9c3">
<div style="display:flex;gap:6px"><input type="file" id="fileExcel" accept=".xlsx,.xls" style="display:none"><button class="tombol" onclick="document.getElementById('fileExcel').click()" style="flex:1;background:#2563eb;color:white">📂 IMPORT EXCEL</button><button class="tombol" onclick="exportExcel()" style="flex:1;background:#16a34a;color:white">📤 EXPORT EXCEL</button></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="namaBaru" placeholder="Nama barang baru" style="flex:1;padding:11px;border-radius:10px;border:1px solid #ccc;font-weight:bold"><input id="stokBaru" type="number" placeholder="Awal" style="width:60px;padding:11px;border-radius:10px;border:1px solid #ccc;text-align:center;font-weight:900"><select id="satBaru" style="width:65px;padding:11px;border-radius:10px;border:1px solid #ccc;font-weight:900"><option>gr</option><option>kg</option><option selected>pcs</option><option>ekor</option><option>karung</option></select><button class="tombol" onclick="tambah()" style="background:#15803d;color:white;width:55px">+</button></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="cari" oninput="load()" placeholder="🔍 Cari barang..." style="flex:1;padding:11px;border-radius:10px;border:1px solid #ccc"><button class="tombol" onclick="resetHarian()" style="background:#facc15;color:black;width:85px;font-size:11px">🔄 RESET</button></div>
</div>
<div id="list" style="padding:6px;background:#f0f0f0;min-height:400px">Loading...</div>
</div>
</div>

<script>
var URL_API="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
var toko="KATAPANG";

var defaultEmails={
 "KATAPANG":"katapang@labbaikchicken.com",
 "ALFATHU":"alfathu@labbaikchicken.com",
 "GADING TUTUKA":"gadingtutuka@labbaikchicken.com",
 "CIWIDEY":"ciwidey@labbaikchicken.com",
 "BALEENDAH":"baleendah@labbaikchicken.com",
 "SUKAMENAK":"sukamenak@labbaikchicken.com",
 "BOJONG SOANG":"bojongsoang@labbaikchicken.com",
 "MARGAASIH":"margaasih@labbaikchicken.com"
};

function getEmailToko(t){ try{ var s=JSON.parse(localStorage.getItem('emails_toko')||'{}'); if(s[t]) return s[t]; }catch(e){} return defaultEmails[t]||''; }
function simpanEmailToko(){
 var email=document.getElementById('emailInput').value.trim();
 if(!email||email.indexOf('@')==-1){alert('Email harus ada @');return;}
 try{ var s=JSON.parse(localStorage.getItem('emails_toko')||'{}'); s[toko]=email; localStorage.setItem('emails_toko',JSON.stringify(s)); alert('Email '+toko+' disimpan: '+email); document.getElementById('msgLogin').innerText='✅ Email '+toko+' = '+email; }catch(e){}
}
function editDaftarEmail(){
 var s={}; try{s=JSON.parse(localStorage.getItem('emails_toko')||'{}');}catch(e){}
 var html='<b>📋 EMAIL PER TOKO:</b><br><br>';
 for(var k in defaultEmails){ var em=getEmailToko(k); html+=k+': <b>'+em+'</b><br>'; }
 html+='<br><button onclick="document.getElementById(\'daftarEmail\').style.display=\'none\'" style="background:#15803d;color:white;border:none;padding:6px 12px;border-radius:6px">Tutup</button> <button onclick="if(confirm(\'Reset semua?\')){localStorage.removeItem(\'emails_toko\'); location.reload();}" style="background:#fee2e2;border:none;padding:6px 10px;border-radius:6px">Reset</button>';
 document.getElementById('daftarEmail').innerHTML=html;
 document.getElementById('daftarEmail').style.display='block';
}

function gantiToko(v){
 toko=v;
 document.getElementById('judul').innerText=v;
 document.getElementById('namaTokoLogin').innerText=v;
 document.getElementById('tokoEmailLabel').innerText=v;
 document.getElementById('emailInput').value=getEmailToko(v);
 document.getElementById('msgLogin').innerText='Email '+v+' = '+getEmailToko(v);
 try{ localStorage.setItem('toko_labbaik',v); }catch(e){}
 if(checkLogin()) load();
}

function checkLogin(){
 try{
  var em=localStorage.getItem('email_labbaik');
  var tk=localStorage.getItem('toko_login');
  if(em && tk===toko){
   document.getElementById('loginArea').style.display='none';
   document.getElementById('userInfo').style.display='block';
   document.getElementById('mainArea').style.display='block';
   document.getElementById('infoUser').innerText=em+' | '+toko+' | LOGIN';
   return true;
  }
 }catch(e){}
 document.getElementById('loginArea').style.display='block';
 document.getElementById('userInfo').style.display='none';
 document.getElementById('mainArea').style.display='none';
 document.getElementById('emailInput').value=getEmailToko(toko);
 document.getElementById('namaTokoLogin').innerText=toko;
 document.getElementById('tokoEmailLabel').innerText=toko;
 document.getElementById('msgLogin').innerText='Login untuk '+toko+' - '+getEmailToko(toko);
 return false;
}

function login(){
 var email=document.getElementById('emailInput').value.trim();
 if(!email||email.indexOf('@')==-1){ alert('Email harus ada @ contoh: katapang@gmail.com'); return; }
 try{ localStorage.setItem('email_labbaik',email); localStorage.setItem('toko_login',toko); }catch(e){}
 document.getElementById('loginArea').style.display='none';
 document.getElementById('userInfo').style.display='block';
 document.getElementById('mainArea').style.display='block';
 document.getElementById('infoUser').innerText=email+' | '+toko+' | LOGIN OK';
 load();
}
function logout(){ try{ localStorage.removeItem('email_labbaik'); localStorage.removeItem('toko_login'); }catch(e){} checkLogin(); }

function setStatus(sisa,sat,nama){
 sat=(sat||'pcs').toLowerCase(); nama=(nama||'').toLowerCase();
 if(nama.indexOf('potongan kecil')>=0||nama.indexOf('potong kecil')>=0||nama.indexOf('potongan besar')>=0||nama.indexOf('potong besar')>=0){ if(sisa<=300) return '🚨 KRISIS'; if(sisa<=450) return '⚠️ MENIPIS'; return '✅ Aman'; }
 if(sat==='pcs'||sat==='ekor'){ if(sisa<=10)return'🚨 KRISIS'; if(sisa<=25)return'⚠️ MENIPIS'; if(sisa>=100)return'📦 OVER'; return'✅ Aman';}
 else if(sat==='kg'){ if(sisa<=5)return'🚨 KRISIS'; if(sisa<=10)return'⚠️ MENIPIS'; if(sisa>=50)return'📦 OVER'; return'✅ Aman';}
 else{ if(sisa<=1000)return'🚨 KRISIS'; if(sisa<=3000)return'⚠️ MENIPIS'; return'✅ Aman';}
}
function load(){
 if(!checkLogin()) return;
 document.getElementById('list').innerHTML='⏳ Loading '+toko+'...';
 var q=document.getElementById('cari').value.toLowerCase();
 fetch(URL_API+'?select=*&limit=10000&toko=eq.'+toko,{headers:H}).then(function(r){return r.json();}).then(function(data){
  var h=''; for(var i=0;i<data.length;i++){
   if(q && data[i].nama_barang.toLowerCase().indexOf(q)==-1) continue;
   var it=data[i]; var stok=Number(it.stok)||0; var masuk=Number(it.penerimaan)||0; var pakai=Number(it.terpakai)||0; var sisa=stok+masuk-pakai; var sat=it.satuan||'pcs'; var st=setStatus(sisa,sat,it.nama_barang);
   var bg=st.indexOf('KRISIS')>=0?'background:#fee2e2;':st.indexOf('MENIPIS')>=0?'background:#fef9c3;':'';
   h+='<div class=card style="'+bg+'"><div style=display:flex;justify-content:space-between><b>'+it.nama_barang+'</b><button onclick="editSat('+it.id+',\''+sat+'\')" style="background:#15803d;color:white;border:none;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:900">'+sat+' ✏️</button></div><div style=margin-top:8px;background:#f9fafb;padding:8px;border-radius:10px;font-size:13px;line-height:2.2"><span class=u onclick="editAwal('+it.id+','+stok+')">Awal: '+stok+' ✏️</span> <span class=u style=color:#2563eb" onclick="editMasuk('+it.id+','+masuk+')">Masuk: '+masuk+' ✏️</span> <span class=u style=color:#dc2626" onclick="editPakai('+it.id+','+pakai+')">Keluar: '+pakai+' ✏️</span><div style=font-weight:900;margin-top:4px">SISA: <span style=color:#15803d">'+sisa+'</span> '+sat+' - '+st+'</div></div><div style=display:flex;gap:6px;margin-top:8px"><button class=tombol onclick="addMasuk('+it.id+','+masuk+')" style="flex:1;background:#2563eb;color:white;padding:10px">📥 +Masuk</button><button class=tombol onclick="addPakai('+it.id+','+pakai+')" style="flex:1;background:#dc2626;color:white;padding:10px">📤 +Keluar</button><button class=tombol onclick="hapus('+it.id+')" style="background:#fee2e2;color:#dc2626;width:45px">✕</button></div></div>';
  }
  if(h==='') h='<div class=card><b>Belum ada barang di '+toko+'</b><br>Pencet 📂 IMPORT EXCEL</div>';
  document.getElementById('list').innerHTML=h;
 });
}
function editAwal(id,now){ var v=prompt('EDIT SALDO AWAL\nSekarang: '+now); if(v===null) return; fetch(URL_API+'?id=eq.'+id,{method:'PATCH',
