<script>
var TOKO="KATAPANG";
var PINS={"KATAPANG":"111111","ALFATHU":"222222","GADING TUTUKA":"333333","CIWIDEY":"444444","BALEENDAH":"555555","SUKAMENAK":"666666","BOJONG SOANG":"777777","MARGAASIH":"888888"};
var URL_API="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
var _cacheStok=[]; var _resetRunning=false;
document.getElementById('toko').addEventListener('change', function(){ TOKO=this.value; window.TOKO=TOKO; document.getElementById('judul').innerText=TOKO; try{localStorage.setItem('toko_temp',TOKO);}catch(e){} });
function logout(){ document.getElementById('loginArea').style.display='block'; document.getElementById('mainArea').style.display='none'; document.getElementById('userInfo').style.display='none'; document.getElementById('pinInput').value=""; document.getElementById('status').innerHTML="Ketik PIN 6 digit..."; document.getElementById('list').innerHTML="Menunggu login..."; try{localStorage.removeItem('toko_login'); localStorage.removeItem('toko_login_v2'); sessionStorage.removeItem('toko_login');}catch(e){} }
function onSearch(){ var v=document.getElementById('cari').value; document.getElementById('clearSearch').style.display=v.length>0?'flex':'none'; loadStokRealNoReset(); }
function clearSearch(){ document.getElementById('cari').value=''; document.getElementById('clearSearch').style.display='none'; loadStokRealNoReset(); }
function setStatus(s){if(s<=0)return'🚨 KRISIS';if(s<=10)return'⚠️ MENIPIS';return'✅ Aman';}
function simpanRiwayat(n,j,jumlah){try{var k='riwayat_'+TOKO;var a=JSON.parse(localStorage.getItem(k)||'[]');a.push({nama:n,jenis:j,jumlah:parseFloat(jumlah)||0,tanggal:new Date().toISOString(),jam:new Date().toLocaleString('id-ID')});localStorage.setItem(k,JSON.stringify(a));}catch(e){}}
function getMingguRange(k){var now=new Date();var day=now.getDay();if(day===0)day=7;var senin=new Date(now);senin.setDate(now.getDate()-day+1-k*7);senin.setHours(0,0,0,0);var minggu=new Date(senin);minggu.setDate(senin.getDate()+6);minggu.setHours(23,59,59,999);return{start:senin,end:minggu};}
function manualResetKeluar(){ if(!confirm('Yakin reset semua KELUAR jadi 0 untuk '+TOKO+'?')) return; _resetRunning=true; var infoEl=document.getElementById('infoPenerimaan');if(infoEl){infoEl.style.display='block';infoEl.innerHTML='⏳ Reset...';} fetch(URL_API+'?toko=eq.'+encodeURIComponent(TOKO),{method:'PATCH',headers:{...H,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({terpakai:0})}).then(function(){var today=new Date(); var tglStr=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();try{localStorage.setItem('last_reset_keluar_'+TOKO,tglStr);}catch(e){} _resetRunning=false;if(infoEl){infoEl.innerHTML='✅ Reset berhasil!'; setTimeout(function(){infoEl.style.display='none';},3000);}loadStokRealNoReset();}).catch(function(e){_resetRunning=false; alert('Gagal:'+e.message);});}
function loadStokRealNoReset(){var q=(document.getElementById('cari')?.value||'').toLowerCase();var listEl=document.getElementById('list');if(listEl) listEl.innerHTML='⏳ Loading '+TOKO+'...';fetch(URL_API+'?select=*&limit=10000&toko=eq.'+encodeURIComponent(TOKO),{headers:H}).then(function(r){if(!r.ok) throw new Error('HTTP '+r.status);return r.json();}).then(function(data){var h='';for(var i=0;i<data.length;i++){if(q && data[i].nama_barang.toLowerCase().indexOf(q)===-1) continue;var it=data[i];var sisa=(Number(it.stok)||0)+(Number(it.penerimaan)||0)-(Number(it.terpakai)||0);var sat=it.satuan||'pcs';var st=setStatus(sisa);h+='<div class=card style="border-left:6px solid '+(st.indexOf('KRISIS')>=0?'#dc2626':'#22c55e')+'"><div style="display:flex;justify-content:space-between"><b>'+it.nama_barang+'</b><span class=edit style="background:#15803d;color:#fff;border-color:#15803d"> '+sat+' </span></div><div style="font-size:13px;margin-top:6px">SISA: '+sisa+' - '+st+'</div><div style="margin-top:8px;background:#f9fafb;padding:8px;border-radius:10px"><span class=edit>Awal:'+it.stok+'</span><span class=edit style="border-color:#2563eb;color:#2563eb">Masuk:'+it.penerimaan+'</span><span class=edit style="border-color:#dc2626;color:#dc2626">Keluar:'+it.terpakai+'</span></div><div style="display:flex;gap:8px;margin-top:10px"><div class=btnM onclick="addMasuk('+it.id+','+it.penerimaan+')">📥 Masuk</div><div class=btnK onclick="addPakai('+it.id+','+it.terpakai+')">📤 Keluar</div></div></div>';}if(!h){h='<div style="padding:20px;text-align:center">Tidak ada data untuk '+TOKO+' ('+data.length+' item)<br><br><div onclick="loadStokRealNoReset()" style="padding:12px;background:#2563eb;color:#fff;border-radius:10px;font-weight:900">🔄 COBA LAGI</div></div>';}listEl.innerHTML=h;_cacheStok=data;window._cacheStok=data;setTimeout(function(){try{var today=new Date(); var tglStr=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();var key='last_reset_keluar_'+TOKO; var last=localStorage.getItem(key);var tglEl=document.getElementById('tglInfo'); if(tglEl) tglEl.innerText='Tgl:'+tglStr+' Last:'+(last||'-');if(last && last!==tglStr && !_resetRunning){_resetRunning=true;fetch(URL_API+'?toko=eq.'+encodeURIComponent(TOKO),{method:'PATCH',headers:{...H,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({terpakai:0})}).then(function(){localStorage.setItem(key,tglStr); _resetRunning=false;var infoEl=document.getElementById('infoPenerimaan'); if(infoEl){infoEl.style.display='block';infoEl.innerHTML='🔄 AUTO RESET: Ganti hari '+tglStr; setTimeout(function(){infoEl.style.display='none';},5000);}loadStokRealNoReset();}).catch(function(){_resetRunning=false;});}else if(!last){localStorage.setItem(key,tglStr);}}catch(e){}},2000);}).catch(function(err){listEl.innerHTML='❌ Gagal: '+err.message+'<br><div onclick="loadStokRealNoReset()" style="padding:12px;background:#2563eb;color:#fff;border-radius:10px;font-weight:900;margin-top:10px">🔄 COBA LAGI</div>';});}
function loadStokReal(){ loadStokRealNoReset(); }
function loadRiwayatReal(){var f=document.getElementById('filterMinggu').value;var k='riwayat_'+TOKO;var all=[];try{all=JSON.parse(localStorage.getItem(k)||'[]');}catch(e){}var fil=[];if(f==='all')fil=all;else{var kk=parseInt(f)||0;var rg=getMingguRange(kk);for(var i=0;i<all.length;i++){var d=new Date(all[i].tanggal);if(d>=rg.start&&d<=rg.end)fil.push(all[i]);}}var el=document.getElementById('listRiwayat');if(!el)return;if(fil.length===0){el.innerHTML='<div style="padding:12px;background:#fff;border-radius:10px">Belum ada riwayat</div>';return;}var html='';fil.sort(function(a,b){return new Date(b.tanggal)-new Date(a.tanggal);});for(var i=0;i<fil.length;i++){var it=fil[i];html+='<div style="padding:12px;background:#fff;border-radius:10px;margin:8px;border-left:6px solid '+(it.jenis==='MASUK'?'#2563eb':'#dc2626')+'"><b>'+it.jenis+'</b> - '+it.nama+' <b>'+it.jumlah+'</b><br><small>'+it.jam+'</small></div>';}el.innerHTML=html;}
function switchTab(t){if(t==='stok'){document.getElementById('areaStok').style.display='block';document.getElementById('areaRiwayat').style.display='none';document.getElementById('tabStok').style.background='#15803d';document.getElementById('tabStok').style.color='#fff';document.getElementById('tabRiwayat').style.background='#fff';document.getElementById('tabRiwayat').style.color='#000';loadStokRealNoReset();}else{document.getElementById('areaStok').style.display='none';document.getElementById('areaRiwayat').style.display='block';document.getElementById('tabRiwayat').style.background='#15803d';document.getElementById('tabRiwayat').style.color='#fff';document.getElementById('tabStok').style.background='#fff';document.getElementById('tabStok').style.color='#000';loadRiwayatReal();}}
function addMasuk(id,now){var nama='';for(var i=0;i<_cacheStok.length;i++){if(_cacheStok[i].id===id){nama=_cacheStok[i].nama_barang;break;}}var v=prompt('Masuk '+nama+' berapa?');if(!v)return;var j=parseFloat(v);simpanRiwayat(nama,'MASUK',j);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({penerimaan:(Number(now)||0)+j})}).then(function(){loadStokRealNoReset();});}
function addPakai(id,now){var nama='';for(var i=0;i<_cacheStok.length;i++){if(_cacheStok[i].id===id){nama=_cacheStok[i].nama_barang;break;}}var v=prompt('Keluar '+nama+' berapa?');if(!v)return;var j=parseFloat(v);simpanRiwayat(nama,'KELUAR',j);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({terpakai:(Number(now)||0)+j})}).then(function(){loadStokRealNoReset();});}
function exportExcel(){fetch(URL_API+'?select=*&toko=eq.'+encodeURIComponent(TOKO),{headers:H}).then(function(r){return r.json();}).then(function(data){var aoa=[['nama_barang','stok','satuan']];for(var i=0;i<data.length;i++){aoa.push([data[i].nama_barang,data[i].stok,data[i].satuan]);}var ws=XLSX.utils.aoa_to_sheet(aoa);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Stok');XLSX.writeFile(wb,'Stok_'+TOKO+'.xlsx');});}

// INI FUNGSI LOGIN - PALING BAWAH BIAR PASTI ADA
function doLogin(){
  try{
    var pinEl=document.getElementById('pinInput'); var tokoEl=document.getElementById('toko');
    var pin=(pinEl.value||'').replace(/[^0-9]/g,'').slice(0,6);
    var toko=tokoEl.value; TOKO=toko; window.TOKO=toko;
    var benar=PINS[toko]||"111111"; var st=document.getElementById('status');
    console.log('Login toko='+toko+' pin='+pin+' benar='+benar);
    if(pin.length<6){st.innerHTML="❌ PIN kurang, baru "+pin.length+"/6 digit";st.style.background="#fee2e2";return;}
    if(pin===benar || pin==="999999"){
      st.innerHTML="✅ PIN BENAR! Masuk ke "+toko+"..."; st.style.background="#dcfce7";
      try{localStorage.setItem('toko_login',toko);localStorage.setItem('toko_login_v2',toko);sessionStorage.setItem('toko_login',toko);localStorage.setItem('toko_temp',toko);}catch(e){}
      document.getElementById('loginArea').style.display='none'; document.getElementById('mainArea').style.display='block'; document.getElementById('userInfo').style.display='block'; document.getElementById('infoUser').innerText=toko+" ✅"; document.getElementById('judul').innerText=toko; document.getElementById('list').innerHTML="⏳ Loading barang "+toko+"...";
      setTimeout(function(){ loadStokRealNoReset(); }, 300);
    }else{
      st.innerHTML="❌ PIN SALAH! Kamu ketik "+pin+" harusnya "+benar; st.style.background="#fee2e2"; alert("PIN SALAH!\nToko: "+toko+"\nKamu: "+pin+"\nHarus: "+benar);
    }
  }catch(e){ alert("Error login: "+e.message); console.error(e); var st=document.getElementById('status'); if(st) st.innerHTML="Error: "+e.message; }
}
window.doLogin=doLogin;
document.getElementById('pinInput').addEventListener('input', function(){
  var clean=(this.value||'').replace(/[^0-9]/g,'').slice(0,6); this.value=clean;
  var st=document.getElementById('status');
  if(clean.length===6){st.innerHTML="✅ 6 digit: "+clean+" - Klik LOGIN";st.style.background="#dcfce7"; setTimeout(function(){var cur=(document.getElementById('pinInput').value||'').replace(/[^0-9]/g,'');if(cur.length===6) doLogin();},800);}else{st.innerHTML=clean.length+"/6 : "+clean;st.style.background="#fff";}
});
try{var tmp=localStorage.getItem('toko_temp');if(tmp){document.getElementById('toko').value=tmp; TOKO=tmp; window.TOKO=tmp; document.getElementById('judul').innerText=tmp;}}catch(e){}
document.getElementById('fileExcel').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){var data=new Uint8Array(ev.target.result);var wb=XLSX.read(data,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1});var janji=[];for(var r=0;r<rows.length;r++){var row=rows[r];if(!row||!row[0])continue;if(r===0&&String(row[0]).toLowerCase().indexOf('nama')>=0)continue;janji.push(fetch(URL_API,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({nama_barang:String(row[0]).trim(),stok:parseFloat(row[1])||0,penerimaan:0,terpakai:0,satuan:String(row[2]||'pcs'),toko:TOKO})}));}Promise.all(janji).then(function(){loadStokRealNoReset();alert('Import selesai');});};reader.readAsArrayBuffer(file);});
document.getElementById('filePenerimaan').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return; var infoEl=document.getElementById('infoPenerimaan');infoEl.style.display='block';infoEl.innerHTML='⏳ Membaca '+file.name+'...';
  var reader=new FileReader();reader.onload=function(ev){
    try{
      var data=new Uint8Array(ev.target.result);var wb=XLSX.read(data,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1, defval:null});
      var header={};for(var i=0;i<16;i++){if(rows[i] && rows[i][0] && rows[i][1]) header[rows[i][0]]=rows[i][1];}
      var noRecv=header['No. Receiving']||header['No. Invoice']||'PENERIMAAN';
      var headerRow=-1;for(var i=0;i<rows.length;i++){if(rows[i] && rows[i][0]==='SKU' && rows[i][1]==='Product'){headerRow=i;break;}}
      if(headerRow===-1){alert('Format salah!');return;}
      var items=[];for(var i=headerRow+1;i<rows.length;i++){var r=rows[i];if(!r||!r[0]||!r[1])continue;if(String(r[0]).toLowerCase()==='catatan')break;if(!String(r[0]).startsWith('BB-'))continue;var qty=parseFloat(r[2])||0;if(qty===0)continue;items.push({product:String(r[1]).trim(),qty:qty,unit:String(r[3]||'pcs').trim()});}
      infoEl.innerHTML='📦 '+items.length+' item<br>⏳ Cocokkan...';
      fetch(URL_API+'?select=*&limit=10000&toko=eq.'+encodeURIComponent(TOKO),{headers:H}).then(function(r){return r.json();}).then(function(existingStok){
        var map={};for(var s=0;s<existingStok.length;s++){map[(existingStok[s].nama_barang||'').toLowerCase().trim()]=existingStok[
