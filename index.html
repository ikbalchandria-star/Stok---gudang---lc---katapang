<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUDANG LABBAIK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
  <!-- HEADER -->
  <div class="bg-green-700 text-white p-4 sticky top-0 z-10">
    <h1 class="font-black text-xl text-center">GUDANG LABBAIK</h1>
    <h2 id="judulToko" class="text-center font-bold text-yellow-300">KATAPANG</h2>
    <select id="toko" onchange="gantiToko()" class="w-full mt-2 p-2.5 rounded-lg text-black font-bold">
      <option value="KATAPANG">🏪 KATAPANG</option>
      <option value="GADING">🏪 GADING - GUDANG LABBAIK CIMAHI</option>
      <option value="ALFATHU">🏪 ALFATHU</option>
      <option value="SUKAMENAK">🏪 SUKAMENAK</option>
      <option value="CIWIDEY">🏪 CIWIDEY</option>
    </select>
  </div>

  <div class="p-3 space-y-2 text-xs">
    <div class="flex gap-2">
      <span class="bg-yellow-200 px-2 py-1 rounded">🟡 Menipis <5kg/10pcs</span>
      <span class="bg-red-200 px-2 py-1 rounded">🔴 Kritis <2kg/5pcs</span>
      <span class="bg-blue-200 px-2 py-1 rounded">🔵 Over >80kg</span>
    </div>
  </div>

  <div id="list" class="p-3 space-y-3 pb-20">Loading...</div>
</div>

<script>
// === GANTI INI PAKAI PUNYA KAMU DARI V6 KEMARIN ===
const SUPABASE_URL = "https://xxxx.supabase.co";
const SUPABASE_KEY = "eyJhbG...anonym key kamu";
// ===================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let tokoAktif = localStorage.getItem('toko_labbaik') || 'KATAPANG';
document.getElementById('toko').value = tokoAktif;

function gantiToko(){
  tokoAktif = document.getElementById('toko').value;
  localStorage.setItem('toko_labbaik', tokoAktif);
  document.getElementById('judulToko').innerText = tokoAktif;
  document.title = "GUDANG LABBAIK " + tokoAktif;
  loadData();
}
gantiToko();

async function loadData(){
  const {data, error} = await sb.from('stok').select('*').order('nama_barang');
  if(error){ document.getElementById('list').innerHTML = error.message; return; }
  let filtered = data.filter(d =>!d.toko || d.toko==tokoAktif);
  if(filtered.length==0) filtered = data;

  let html = '';
  filtered.forEach(i=>{
    let stok = parseFloat(i.stok)||0;
    let sat = (i.satuan||'kg').toLowerCase();
    let min = (sat=='pcs'||sat=='ekor')? 10 : 5;
    let krit = (sat=='pcs'||sat=='ekor')? 5 : 2;
    let max = (sat=='pcs'||sat=='ekor')? 100 : 80;
    let warna = 'border-gray-200', status='✅ Aman';
    if(stok<=krit){ warna='bg-red-100 border-red-500 border-2 animate-pulse'; status='🚨 HAMPIR HABIS!'; }
    else if(stok<=min){ warna='bg-yellow-100 border-yellow-500 border-2'; status='⚠️ MENIPIS!'; }
    else if(stok>=max){ warna='bg-blue-100 border-blue-500 border-2'; status='📦 OVER STOK'; }

    html += `<div class="bg-white p-3 rounded-xl shadow flex justify-between items-center ${warna}">
      <div><div class="font-bold">${i.nama_barang}</div><div class="text-xs mt-1 font-bold">${status} - ${stok} ${sat}</div></div>
      <div class="flex gap-1 items-center">
        <input type="number" value="${stok}" onchange="upd('stok', '${i.id}', this.value)" class="w-16 p-2 border rounded-lg font-bold">
        <select onchange="upd('satuan', '${i.id}', this.value)" class="p-2 border rounded-lg bg-gray-50 font-bold">
          <option value="kg" ${sat=='kg'?'selected':''}>kg</option>
          <option value="gr" ${sat=='gr'?'selected':''}>gr</option>
          <option value="pcs" ${sat=='pcs'?'selected':''}>pcs</option>
          <option value="ekor" ${sat=='ekor'?'selected':''}>ekor</option>
          <option value="karung" ${sat=='karung'?'selected':''}>karung</option>
        </select>
      </div>
    </div>`;
  });
  document.getElementById('list').innerHTML = html || `<div class='text-center p-10'>Belum ada barang di ${tokoAktif}</div>`;
}
async function upd(kolom, id, val){
  let obj={}; obj[kolom]= (kolom=='stok'? parseFloat(val): val);
  await sb.from('stok').update(obj).eq('id', id);
  loadData();
}
</script>
</body>
</html>
