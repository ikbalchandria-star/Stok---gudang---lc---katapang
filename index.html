<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GUDANG LABBAIK V44.1 FIX LOGIN + RIWAYAT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#15803d;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
.box{max-width:480px;margin:0 auto;background:white;min-height:100vh}
.header{padding:12px;background:#15803d;color:white;text-align:center}
.card{border:1px solid #ddd;margin:8px;padding:12px;border-radius:14px;border-left:6px solid #22c55e;background:white}
.tab{display:flex;gap:6px;padding:8px;background:#f0fdf4}
.tab div{flex:1;padding:12px;border-radius:10px;font-weight:900;text-align:center;cursor:pointer}
.tab.on{background:#15803d;color:white}
.tab.off{background:white;border:1px solid #15803d;color:#15803d}
.btn-login{width:100%;padding:20px;background:#15803d;color:white;font-weight:900;font-size:20px;border-radius:14px;border:none;margin-top:12px;touch-action:manipulation;cursor:pointer;display:block}
.btn-login:active{background:#0f5a2b;transform:scale(0.98)}
</style>
</head>
<body>
<div class="box">
<div class="header">
<b>GUDANG LABBAIK CHICKEN</b><br>
<span id="judul" style="color:#bbf7d0;font-weight:900;font-size:19px">KATAPANG</span><br>
<select id="toko" onchange="gantiToko()" style="width:100%;padding:12px;border-radius:10px;margin-top:8px;font-weight:bold">
<option value="KATAPANG">KATAPANG</option><option value="ALFATHU">ALFATHU</option><option value="GADING TUTUKA">GADING TUTUKA</option><option value="CIWIDEY">CIWIDEY</option><option value="BALEENDAH">BALEENDAH</option><option value="SUKAMENAK">SUKAMENAK</option><option value="BOJONG SOANG">BOJONG SOANG</option><option value="MARGAASIH">MARGAASIH</option>
</select>
</div>
<div id="loginArea" style="padding:14px;background:#f0fdf4;text-align:center">
<b>🔐 V44.1 FIX LOGIN + RIWAYAT</b><br>
<span id="infoToko" style="font-size:11px;color:#555">PIN per toko aman</span>
<div style="margin-top:8px">
<input id="pinInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="PIN 6 digit" style="width:100%;padding:20px;border-radius:14px;border:3px solid #15803d;font-weight:900;font-size:24px;text-align:center;letter-spacing:10px;box-sizing:border-box" oninput="cek()" autocomplete="off">
<button type="button" id="btnLogin" class="btn-login" onclick="doLogin()">🔓 TAP UNTUK LOGIN</button>
<div style="display:flex;gap:8px;margin-top:8px">
<button type="button" onclick="isiPIN('111111')" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:10px">TEST 111111</button>
<button type="button" onclick="isiPIN('666666')" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:10px">SUKAMENAK 666666</button>
</div>
</div>
<div id="status" style="font-size:12px;font-weight:700;color:#15803d;margin-top:10px;background:white;padding:8px;border-radius:8px">Ketik PIN toko lalu TAP tombol hijau</div>
</div>
<div id="userInfo" style="display:none;background:#dcfce7;padding:8px;text-align:center;font-size:12px;font-weight:900">
<span id="infoUser"></span> | <span onclick="logout()" style="background:#fee2e2;padding:5px 10px;border-radius:6px;color:#dc2626">🚪 Logout</span>
</div>
<div id="mainArea" style="display:none">
<div class="tab">
<div id="tabStok" class="on" onclick="switchTab('stok')">📦 STOK</div>
<div id="tabRiwayat" class="off" onclick="switchTab('riwayat')">📜 RIWAYAT MINGGUAN</div>
</div>
<div id="areaStok">
<div style="padding:10px;background:#fef9c3">
<div style="display:flex;gap:6px">
<input type="file" id="fileExcel" accept=".xlsx,.xls" style="display:none">
<div onclick="document.getElementById('fileExcel').click()" style="flex:1;padding:13px;background:#2563eb;color:white;border-radius:10px;font-weight:900;text-align:center">📂 IMPORT</div>
<div onclick="exportExcel()" style="flex:1;padding:13px;background:#16a34a;color:white;border-radius:10px;font-weight:900;text-align:center">📤 EXPORT</div>
</div>
<div id="importStatus" style="font-size:11px;font-weight:900;color:#2563eb;margin-top:6px;text-align:center"></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="namaBaru" placeholder="Nama barang" style="flex:1;padding:11px;border-radius:10px;border:1px solid #ccc;font-weight:bold"><input id="stokBaru" type="number" placeholder="Awal" style="width:65px;padding:11px;border-radius:10px;border:1px solid #ccc;text-align:center;font-weight:900"><select id="satBaru" style="width:70px;padding:11px;border-radius:10px;border:1px solid #ccc"><option>gr</option><option>kg</option><option selected>pcs</option><option>ekor</option><option>karung</option></select><div onclick="tambah()" style="background:#15803d;color:white;padding:11px;border-radius:10px;width:55px;font-weight:900;text-align:center">+</div></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="cari" oninput="load()" placeholder="🔍 Cari..." style="flex:1;padding:11px;border-radius:10px;border:1px solid #ccc"><div onclick="resetHarian()" style="background:#facc15;padding:11px;border-radius:10px;width:85px;font-size:11px;font-weight:900;text-align:center">🔄 RESET</div></div>
</div>
<div id="list" style="padding:6px;background:#f0f0f0;min-height:400px">Loading...</div>
</div>
<div id="areaRiwayat" style="display:none;padding:8px;background:#f0fdf4;min-height:500px">
<div style="padding:10px;background:white;border-radius:12px">
<b>📅 Filter Minggu:</b><br>
<select id="filterMinggu" onchange="loadRiwayat()" style="width:100%;padding:12px;border-radius:10px;margin-top:6px;font-weight:900;border:2px solid #15803d">
<option value="0">Minggu Ini</option><option value="1">Minggu Lalu</option><option value="2">2 Minggu Lalu</option><option value="3">3 Minggu Lalu</option><option value="all">Semua Riwayat</option>
</select>
<div style="display:flex;gap:6px;margin-top:8px">
<div onclick="exportRiwayat()" style="flex:1;padding:12px;background:#16a34a;color:white;border-radius:10px;font-weight:900;text-align:center">📤 Export Riwayat</div>
<div onclick="hapusRiwayat()" style="flex:1;padding:12px;background:#fee2e2;color:#dc2626;border-radius:10px;font-weight:900;text-align:center">🗑️ Hapus</div>
</div>
</div>
<div id="listRiwayat" style="margin-top:8px">Loading riwayat...</div>
</div>
</div>
</div>
<script>
// FIX LOGIN: gak pake form submit lagi, langsung button onclick
function setCookie(n,v){try{var d=new Date();d.setTime(d.getTime()+7*24*60*60*1000);document.cookie=n+"="+v+";expires="+d.toUTCString()+";path=/"}catch(e){}try{localStorage.setItem(n,v)}catch(e){}}
function getCookie(n){try{var m=document.cookie.match(new RegExp('(^| )'+n+'=([^;]+)'));if(m)return m[2]}catch(e){}try{var v=localStorage.getItem(n);if(v)return v}catch(e){}return null}
function delCookie(n){try{document.cookie=n+"=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/"}catch(e){}try{localStorage.removeItem(n)}catch(e){}}
var URL_API="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
var toko="KATAPANG";var PIN_MASTER="999999";
var defaultPins={"KATAPANG":"111111","ALFATHU":"222222","GADING TUTUKA":"333333","CIWIDEY":"444444","BALEENDAH":"555555","SUKAMENAK":"666666","BOJONG SOANG":"777777","MARGAASIH":"888888"};
function gantiToko(){var s=document.getElementById('toko');toko=s.value;document.getElementById('judul').innerText=toko;document.getElementById('infoToko').innerText='PIN '+toko+' = '+defaultPins[toko];document.getElementById('status').innerText='Ketik PIN '+toko+' lalu TAP hijau';document.getElementById('pinInput').value='';}
function isiPIN(p){document.getElementById('pinInput').value=p;cek();}
function doLogin(){var el=document.getElementById('pinInput');var pin=(el.value||'').replace(/[^0-9]/g,'').substring(0,6);var stat=document.getElementById('status');if(pin.length<6){stat.innerText='❌ PIN harus 6 digit! Sekarang '+pin.length+'/6';stat.style.background='#fee2e2';stat.style.color='#dc2626';el.focus();return;}var benar=defaultPins[toko];if(pin===benar||pin===PIN_MASTER){setCookie('toko_login',toko);setCookie('verif_ok','yes');setCookie('toko_pin',pin);document.getElementById('loginArea').style.display='none';document.getElementById('mainArea').style.display='block';document.getElementById('userInfo').style.display='block';document.getElementById('infoUser').innerText=toko+' | '+(pin===PIN_MASTER?'OWNER':'KEPALA TOKO')+' ✅';load();}else{stat.innerText='❌ SALAH! PIN '+toko+' harus '+benar+' bukan '+pin;stat.style.background='#fee2e2';stat.style.color='#dc2626';el.value='';el.focus();}}
function cek(){var el=document.getElementById('pinInput');var pin=(el.value||'').replace(/[^0-9]/g,'').substring(0,6);el.value=pin;var stat=document.getElementById('status');stat.style.background='white';stat.style.color='#15803d';stat.innerText=pin.length+'/6 digit - '+(pin.length===6?'SIAP TAP HIJAU!':'lanjut ketik');var btn=document.getElementById('btnLogin');if(pin.length===6){btn.style.background='#16a34a';btn.innerText='✅ TAP UNTUK LOGIN '+toko;}else{btn.style.background='#15803d';btn.innerText='🔓 TAP UNTUK LOGIN';}}
function logout(){delCookie('toko_login');delCookie('verif_ok');document.getElementById('loginArea').style.display='block';document.getElementById('mainArea').style.display='none';document.getElementById('userInfo').style.display='none';document.getElementById('pinInput').value='';document.getElementById('status').innerText='Ketik PIN toko lalu TAP tombol hijau';}
function checkLoginAwal(){var tk=getCookie('toko_login');var ok=getCookie('verif_ok');if(tk&&ok==='yes'){toko=tk;try{document.getElementById('toko').value=tk;document.getElementById('judul').innerText=tk;document.getElementById('infoToko').innerText='PIN '+tk+' = '+defaultPins[tk];}catch(e){}document.getElementById('loginArea').style.display='none';document.getElementById('mainArea').style.display='block';document.getElementById('userInfo').style.display='block';var pin=getCookie('toko_pin');document.getElementById('infoUser').innerText=tk+' | '+(pin===PIN_MASTER?'OWNER':'KEPALA TOKO')+' ✅';load();return true;}return false;}
function setStatus(sisa,sat,nama){sat=(sat||'pcs').toLowerCase();nama=(nama||'').toLowerCase();if(nama.indexOf('potongan')>=0){if(sisa<=300)return'🚨 KRISIS';if(sisa<=450)return'⚠️ MENIPIS';return'✅ Aman';}if(sat==='pcs'||sat==='ekor'){if(sisa<=10)return'🚨 KRISIS';if(sisa<=25)return'⚠️ MENIPIS';if(sisa>=100)return'📦 OVER';return'✅ Aman';}else if(sat==='kg'){if(sisa<=5)return'🚨 KRISIS';if(sisa<=10)return'⚠️ MENIPIS';if(sisa>=50)return'📦 OVER';return'✅ Aman';}else{if(sisa<=1000)return'🚨 KRISIS';if(sisa<=3000)return'⚠️ MENIPIS';return'✅ Aman';}}
function switchTab(t){if(t==='stok'){document.getElementById('areaStok').style.display='block';document.getElementById('areaRiwayat').style.display='none';document.getElementById('tabStok').className='on';document.getElementById('tabRiwayat').className='off';load();}else{document.getElementById('areaStok').style.display='none';document.getElementById('areaRiwayat').style.display='block';document.getElementById('tabStok').className='off';document.getElementById('tabRiwayat').className='on';loadRiwayat();}}
function simpanRiwayat(namaBarang,jenis,jumlah){try{var key='riwayat_'+toko;var all=JSON.parse(localStorage.getItem(key)||'[]');all.push({toko:toko,nama:namaBarang,jenis:jenis,jumlah:parseFloat(jumlah)||0,tanggal:new Date().toISOString(),jam:new Date().toLocaleString('id-ID')});localStorage.setItem(key,JSON.stringify(all));}catch(e){}}
function getMingguRange(mingguKe){var now=new Date();var day=now.getDay();if(day===0)day=7;var senin=new Date(now);senin.setDate(now.getDate()-day+1-mingguKe*7);senin.setHours(0,0,0,0);var minggu=new Date(senin);minggu.setDate(senin.getDate()+6);minggu.setHours(23,59,59,999);return{start:senin,end:minggu};}
function loadRiwayat(){var filter=document.getElementById('filterMinggu').value;var key='riwayat_'+toko;var all=[];try{all=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){all=[];}var filtered=[];if(filter==='all'){filtered=all;}else{var mingguKe=parseInt(filter)||0;var range=getMingguRange(mingguKe);for(var i=0;i<all.length;i++){var d=new Date(all[i].tanggal);if(d>=range.start&&d<=range.end)filtered.push(all[i]);}}if(filtered.length===0){document.getElementById('listRiwayat').innerHTML='<div class=card>Belum ada riwayat di minggu ini untuk '+toko+'</div>';return;}var html='';if(filter!=='all'){var r=getMingguRange(parseInt(filter)||0);var rangeInfo=r.start.toLocaleDateString('id-ID')+' - '+r.end.toLocaleDateString('id-ID');html+='<div style="margin:6px;padding:10px;background:#fef9c3;border-radius:10px"><b>📅 '+rangeInfo+'</b><br>Total: '+filtered.length+' transaksi</div>';}var total={};for(var i=0;i<filtered.length;i++){var k=filtered[i].nama+'|'+filtered[i].jenis;if(!total[k])total[k]=0;total[k]+=filtered[i].jumlah;}html+='<div class=card><b>📊 Ringkasan Mingguan '+toko+'</b><br>';for(var k in total){var parts=k.split('|');html+='<div style="padding:8px;border-bottom:1px dashed #ddd">'+parts[0]+' - '+parts[1]+': <b>'+total[k]+'</b></div>';}html+='</div>';filtered.sort(function(a,b){return new Date(b.tanggal)-new Date(a.tanggal);});for(var i=0;i<filtered.length;i++){var it=filtered[i];var warna=it.jenis==='MASUK'?'#dcfce7':'#fee2e2';var icon=it.jenis==='MASUK'?'📥':'📤';html+='<div class=card style="border-left-color:'+(it.jenis==='MASUK'?'#16a34a':'#dc2626')+';background:'+warna+'"><b>'+icon+' '+it.jenis+'</b> - '+it.nama+'<br><b>'+it.jumlah+'</b> | '+it.jam+'</div>';}document.getElementById('listRiwayat').innerHTML=html;}
function exportRiwayat(){var key='riwayat_'+toko;var all=[];try{all=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){all=[];}if(all.length===0){alert('Belum ada riwayat');return;}var aoa=[['Tanggal','Jam','Toko','Nama Barang','Jenis','Jumlah']];for(var i=0;i<all.length;i++){aoa.push([new Date(all[i].tanggal).toLocaleDateString('id-ID'),all[i].jam,all[i].toko,all[i].nama,all[i].jenis,all[i].jumlah]);}var ws=XLSX.utils.aoa_to_sheet(aoa);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Riwayat_'+toko);XLSX.writeFile(wb,'Riwayat_'+toko+'_mingguan.xlsx');}
function hapusRiwayat(){if(!confirm('Hapus semua riwayat '+toko+'?'))return;localStorage.removeItem('riwayat_'+toko);loadRiwayat();}
function load(){document.getElementById('list').innerHTML='⏳ Loading '+toko+'...';var q=document.getElementById('cari').value.toLowerCase();fetch(URL_API+'?select=*&limit=10000&toko=eq.'+toko,{headers:H}).then(function(r){return r.json();}).then(function(data){var h='';for(var i=0;i<data.length;i++){if(q&&data[i].nama_barang.toLowerCase().indexOf(q)==-1)continue;var it=data[i];var stok=Number(it.stok)||0;var masuk=Number(it.penerimaan)||0;var pakai=Number(it.terpakai)||0;var sisa=stok+masuk-pakai;var sat=it.satuan||'pcs';var st=setStatus(sisa,sat,it.nama_barang);var bg=st.indexOf('KRISIS')>=0?'background:#fee2e2;':st.indexOf('MENIPIS')>=0?'background:#fef9c3;':'';h+='<div class=card style="'+bg+'"><div style="display:flex;justify-content:space-between"><b>'+it.nama_barang+'</b><span onclick="editSat('+it.id+',\''+sat+'\')" style="background:#15803d;color:white;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:900">'+sat+' ✏️</span></div><div style="margin-top:8px;background:#f9fafb;padding:8px;border-radius:10px;font-size:13px"><span onclick="editAwal('+it.id+','+stok+')" style="background:#fff;padding:5px 9px;border-radius:8px;border:1px dashed #888">Awal: '+stok+' ✏️</span> <span onclick="editMasuk('+it.id+','+masuk+')" style="background:#fff;padding:5px 9px;border-radius:8px;border:1px dashed #888;color:#2563eb">Masuk: '+masuk+' ✏️</span> <span onclick="editPakai('+it.id+','+pakai+')" style="background:#fff;padding:5px 9px;border-radius:8px;border:1px dashed #888;color:#dc2626">Keluar: '+pakai+' ✏️</span><div style="font-weight:900">SISA: '+sisa+' - '+st+'</div></div><div style="display:flex;gap:6px;margin-top:8px"><div onclick="addMasuk('+it.id+','+masuk+',\''+it.nama_barang.replace(/'/g,"\\'")+'\')" style="flex:1;padding:12px;background:#2563eb;color:white;border-radius:10px;font-weight:900;text-align:center">📥 +Masuk</div><div onclick="addPakai('+it.id+','+pakai+',\''+it.nama_barang.replace(/'/g,"\\'")+'\')" style="flex:1;padding:12px;background:#dc2626;color:white;border-radius:10px;font-weight:900;text-align:center">📤 +Keluar</div><div onclick="hapus('+it.id+')" style="padding:12px;background:#fee2e2;color:#dc2626;border-radius:10px;width:45px;text-align:center">✕</div></div></div>';}if(h==='')h='<div class=card><b>Belum ada barang di '+toko+'</b></div>';document.getElementById('list').innerHTML=h;});}
function editAwal(id,now){var v=prompt('EDIT AWAL\nSekarang: '+now);if(v===null)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({stok:parseFloat(v)||0})}).then(function(){load();});}
function editMasuk(id,now){var v=prompt('EDIT MASUK\nSekarang: '+now);if(v===null)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({penerimaan:parseFloat(v)||0})}).then(function(){load();});}
function editPakai(id,now){var v=prompt('EDIT KELUAR\nSekarang: '+now);if(v===null)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({terpakai:parseFloat(v)||0})}).then(function(){load();});}
function editSat(id,now){var v=prompt('Satuan:',now);if(!v)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({satuan:v.toLowerCase()})}).then(function(){load();});}
function addMasuk(id,now,nama){var v=prompt('Tambah Masuk '+nama+':');if(!v)return;var j=parseFloat(v);simpanRiwayat(nama,'MASUK',j);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({penerimaan:(Number(now)||0)+j})}).then(function(){load();});}
function addPakai(id,now,nama){var v=prompt('Keluar berapa '+nama+':');if(!v)return;var j=parseFloat(v);simpanRiwayat(nama,'KELUAR',j);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({terpakai:(Number(now)||0)+j})}).then(function(){load();});}
function hapus(id){if(!confirm('Hapus?'))return;fetch(URL_API+'?id=eq.'+id,{method:'DELETE',headers:H}).then(function(){load();});}
function tambah(){var n=document.getElementById('namaBaru').value.trim();var s=parseFloat(document.getElementById('stokBaru').value||0);var sa=document.getElementById('satBaru').value;if(!n){alert('Isi nama');return;}fetch(URL_API,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({nama_barang:n,stok:s,penerimaan:0,terpakai:0,satuan:sa,toko:toko})}).then(function(){document.getElementById('namaBaru').value='';document.getElementById('stokBaru').value='';load();});}
function resetHarian(){if(!confirm('RESET '+toko+'?'))return;fetch(URL_API+'?select=*&toko=eq.'+toko,{headers:H}).then(function(r){return r.json();}).then(function(data){var i=0;function next(){if(i>=data.length){alert('Reset selesai');load();return;}var it=data[i++];var sisa=(Number(it.stok)||0)+(Number(it.penerimaan)||0)-(Number(it.terpakai)||0);fetch(URL_API+'?id=eq.'+it.id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({stok:sisa,penerimaan:0,terpakai:0})}).then(next);}next();});}
function exportExcel(){document.getElementById('importStatus').innerText='⏳ Exporting...';fetch(URL_API+'?select=*&toko=eq.'+toko,{headers:H}).then(function(r){return r.json();}).then(function(data){if(data.length
