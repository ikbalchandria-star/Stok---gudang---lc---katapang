<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDANG LABBAIK V44.6 - PIN HIDDEN</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html,body{margin:0;background:#15803d;font-family:sans-serif}
.box{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.card{padding:12px;border-bottom:1px solid #eee;background:#fff}
.edit{padding:6px 10px;border-radius:8px;border:2px dashed #888;font-weight:900;display:inline-block;margin:2px;font-size:12px;background:#fff;cursor:pointer}
.btnM{flex:1;padding:14px;background:#2563eb;color:#fff;border-radius:12px;font-weight:900;text-align:center;cursor:pointer}
.btnK{flex:1;padding:14px;background:#dc2626;color:#fff;border-radius:12px;font-weight:900;text-align:center;cursor:pointer}
</style>
</head><body>
<div class="box">
<div style="background:#15803d;color:#fff;padding:12px;text-align:center"><b>GUDANG LABBAIK CHICKEN</b><br>
<select id="toko" style="width:100%;padding:12px;border-radius:10px;margin-top:6px;font-weight:900" onchange="toko=this.value;document.getElementById('judul').innerText=this.value;localStorage.setItem('toko_temp',this.value)">
<option value="KATAPANG">KATAPANG</option><option value="ALFATHU">ALFATHU</option><option value="GADING TUTUKA">GADING TUTUKA</option><option value="CIWIDEY">CIWIDEY</option><option value="BALEENDAH">BALEENDAH</option><option value="SUKAMENAK">SUKAMENAK</option><option value="BOJONG SOANG">BOJONG SOANG</option><option value="MARGAASIH">MARGAASIH</option>
</select>
<div id="judul" style="color:#bbf7d0;font-weight:900;margin-top:6px">KATAPANG</div></div>

<div id="loginArea" style="padding:25px;background:#f0fdf4;text-align:center">
<b style="font-size:16px">🔐 LOGIN GUDANG</b><br>
<span style="font-size:12px;color:#666">Pilih toko & masukkan PIN 6 digit</span><br><br>
<input id="pinInput" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" style="width:100%;padding:22px;border-radius:14px;border:4px solid #15803d;font-weight:900;font-size:28px;text-align:center;letter-spacing:12px;box-sizing:border-box" oninput="cek()">
<div id="status" style="margin-top:10px;padding:10px;background:#fff;border-radius:8px;font-weight:900;color:#15803d;font-size:13px">Ketik 6 digit = otomatis masuk</div>
<button type="button" onclick="doLogin()" style="width:100%;padding:22px;background:#16a34a;color:#fff;font-weight:900;font-size:20px;border-radius:14px;border:none;margin-top:12px;box-shadow:0 4px 12px rgba(0,0,0,.2)">🔓 LOGIN</button>
<div style="margin-top:15px;font-size:11px;color:#888">PIN hanya dibagikan via foto ke kepala toko</div>
</div>

<div id="userInfo" style="display:none;background:#dcfce7;padding:8px;text-align:center;font-size:13px;font-weight:900"><span id="infoUser"></span> | <span onclick="logout()" style="background:#fee2e2;padding:5px 10px;border-radius:6px;color:#dc2626">Logout</span></div>

<div id="mainArea" style="display:none">
<div style="display:flex;gap:8px;padding:10px;background:#f0fdf4">
<div id="tabStok" style="flex:1;padding:14px;border-radius:12px;font-weight:900;text-align:center;background:#15803d;color:#fff" onclick="switchTab('stok')">📦 STOK</div>
<div id="tabRiwayat" style="flex:1;padding:14px;border-radius:12px;font-weight:900;text-align:center;background:#fff;border:2px solid #15803d" onclick="switchTab('riwayat')">📜 RIWAYAT</div>
</div>
<div id="areaStok">
<div style="padding:10px;background:#fefce8;display:flex;gap:8px">
<input type="file" id="fileExcel" accept=".xlsx,.xls" style="display:none">
<div onclick="document.getElementById('fileExcel').click()" style="flex:1;padding:14px;background:#2563eb;color:#fff;border-radius:12px;font-weight:900;text-align:center">📁 IMPORT</div>
<div onclick="exportExcel()" style="flex:1;padding:14px;background:#16a34a;color:#fff;border-radius:12px;font-weight:900;text-align:center">📤 EXPORT</div>
</div>
<div id="importStatus" style="font-size:11px;font-weight:900;text-align:center"></div>
<div id="list" style="background:#f0f0f0;min-height:500px">Loading...</div>
</div>
<div id="areaRiwayat" style="display:none;padding:8px;background:#f0fdf4;min-height:500px">
<select id="filterMinggu" onchange="loadRiwayat()" style="width:100%;padding:12px;border-radius:10px;font-weight:900;border:2px solid #15803d"><option value="0">Minggu Ini</option><option value="1">Minggu Lalu</option><option value="all">Semua</option></select>
<div style="display:flex;gap:6px;margin-top:8px"><div onclick="exportRiwayat()" style="flex:1;padding:12px;background:#16a34a;color:#fff;border-radius:10px;font-weight:900;text-align:center">📤 Export Riwayat</a
