<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOK GUDANG LC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;padding:15px;background:#f2f2f2;margin:0}
h2{margin:10px 0}
.status{background:#111;color:#fff;padding:14px;border-radius:14px;font-size:14px;margin-bottom:14px}
.row{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:14px;border:1px solid #ddd;border-radius:14px;font-size:16px;background:#fff;box-sizing:border-box}
input.small{flex:0.5}
button.main{width:100%;padding:16px;background:#00e676;border:0;border-radius:14px;font-weight:800;font-size:17px;margin-top:2px}
.item{background:#fff;padding:14px;border-radius:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.btn-del{background:#ff3b30;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<h2>📦 STOK GUDANG LC</h2>
<div class="status" id="status">⏳ Connecting...</div>
<div class="row">
<input id="nama" placeholder="Nama barang">
<input id="stok" class="small" type="number" placeholder="Stok">
<input id="pakai" class="small" type="number" placeholder="Pakai">
</div>
<button class="main" onclick="tambah()">+ Tambah Barang</button>
<div id="list"></div>
<script>
const SUPA_URL = "https://lgunwtgwlzggfmfjzxqm.supabase.co";
const SUPA_KEY = "sb_publishable_9cBL507qhMKrDzofjIow-A_Y0d4Tesk";
const client = supabase.createClient(SUPA_URL, SUPA_KEY);
async function load(){
  const st=document.getElementById('status');
  try{
    let {data,error}=await client.from('stok').select('*').order('id',{ascending:false});
    if(error) throw error;
    st.innerHTML='✅ Connected - '+SUPA_URL;
    let html='';
    if(!data||data.length==0) html="<p style='text-align:center;color:#888;margin-top:20px'>Belum ada barang, tambah di atas</p>";
    else data.forEach(r=>{
      html+=`<div class="item"><div><b>${r.nama_barang||r.nama||'-'}</b><br><small>Stok: ${r.stok??0} | Pakai: ${r.terpakai??r.pakai??0}</small></div><div><button class="btn-del" onclick="hapus(${r.id})">Hapus</button></div></div>`;
    });
    document.getElementById('list').innerHTML=html;
  }catch(e){
    st.innerHTML='❌ '+e.message;
  }
}
async function tambah(){
  let n=document.getElementById('nama').value.trim();
  let s=parseInt(document.getElementById('stok').value||0);
  let p=parseInt(document.getElementById('pakai').value||0);
  if(!n) return alert('Isi nama barang!');
  let {error}=await client.from('stok').insert([{nama_barang:n,stok:s,terpakai:p}]);
  if(error) alert(error.message);
  else {document.getElementById('nama').value='';document.getElementById('stok').value='';document.getElementById('pakai').value='';load();}
}
async function hapus(id){
  if(!confirm('Hapus barang ini?')) return;
  await client.from('stok').delete().eq('id',id);
  load();
}
load();
</script>
</body>
</html>
