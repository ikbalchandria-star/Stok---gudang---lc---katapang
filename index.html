<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LABBAIK V20 FINAL LENGKAP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f0f0f0}
.header{background:#15803d;color:white;padding:16px;position:sticky;top:0;z-index:10}
.btn{padding:12px;border-radius:12px;border:none;font-weight:900;cursor:pointer}
.card{background:white;margin:10px;padding:12px;border-radius:16px;box-shadow:0 2px 6px #0001;border-left:4px solid #22c55e}

.boxM{background:white;width:100%;max-width:360px;padding:18px;border-radius:20px}

</head>
<body>
<div style="max-width:480px;margin:auto;background:white;min-height:100vh">
<div class="header">
<div style="text-align:center;font-weight:900">GUDANG LABBAIK CHICKEN</div>
<div id="judul" style="text-align:center;color:#fde047;font-size:13px;margin-top:4px">V20 FINAL</div>
<select id="toko" style="width:100%;padding:14px;border-radius:12px;margin-top:10px;font-weight:bold;color:black">

</select>

<div id="areaKunci" style="display:none;text-align:center;margin-top:8px">
<span id="labelToko" style="background:white;color:#15803d;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px"></span><br>
<button onclick="openGantiToko()" style="background:none;border:none;color:#fde047;text-decoration:underline;font-size:11px;padding:6px">Ganti Toko</button>
<button onclick="openGantiPin()" style="background:none;border:none;color:#fde047;text-decoration:underline;font-size:11px;padding:6px;margin-left:8px">Ganti PIN</button>
</div>
<div style="display:flex;gap:6px;margin-top:10px">
<button onclick="setSO('harian')" id="b-harian" class="btn" style="flex:1;background:#facc15;color:black">HARIAN</button>
<button onclick="setSO('mingguan')" id="b-mingguan" class="btn" style="flex:1;background:#ffffff33;color:white">MINGGUAN</button>
<button onclick="setSO('bulanan')" id="b-bulanan" class="btn" style="flex:1;background:#ffffff33;color:white">BULANAN</button>
</div>
</div>

<div style="padding:12px;background:#fef9c3;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;gap:6px">
<input id="namaBaru" placeholder="Nama barang baru" style="flex:1;padding:14px;border-radius:12px;border:1px solid #ccc;font-weight:bold">
<input id="stokBaru" type="number" placeholder="Awal" style="width:70px;padding:14px;border-radius:12px;border:1px solid #ccc;text-align:center;font-weight:900">
<select id="satBaru" style="width:75px;padding:14px;border-radius:12px;border:1px solid #ccc;font-weight:900"><option>gr</option><option>kg</option><option selected>pcs</option><option>ekor</option><option>karung</option></select>
<button onclick="tambahBarang()" class="btn" style="background:#15803d;color:white;width:50px">+</button>
</div>
<div style="display:flex;gap:6px">
<input type="file" id="fileSO" accept=".xlsx,.xls,.csv" style="display:none">
<button onclick="importExcel()" class="btn" style="flex:1;background:#2563eb;color:white">📂 IMPORT EXCEL</button>
<button onclick="resetHarian()" class="btn" style="background:#facc15;color:black;font-size:12px">🔄 RESET</button>
</div>
<div style="display:flex;gap:6px">
<input id="cari" oninput="load()" placeholder="🔍 Cari barang" style="flex:1;padding:14px;border-radius:12px;border:1px solid #ccc">
</div>
</div>

<div id="list" style="padding:12px">Pilih toko dulu...</div>
</div>

<!-- MODAL PIN MASUK -->
<div id="mPin" class="modal"><div class="boxM"><b id="mPinT">MASUKAN PIN</b><br><small id="mPinD"></small><input id="mPinI" type="password" inputmode="numeric" placeholder="****"><div style="display:flex;gap:8px"><button onclick="closeM('mPin')" class="btn" style="flex:1;background:#eee">Batal</button><button onclick="doMasuk()" class="btn" style="flex:1;background:#15803d;color:white">MASUK</button></div></div></div>
<!-- MODAL BUAT PIN -->
<div id="mBuat" class="modal"><div class="boxM"><b>BUAT PIN BARU</b><br><small id="mBuatT"></small><input id="mBuat1" type="password" inputmode="numeric" placeholder="PIN baru 4 digit"><input id="mBuat2" type="password" inputmode="numeric" placeholder="Ulangi PIN"><div style="display:flex;gap:8px"><button onclick="closeM('mBuat')" class="btn" style="flex:1;background:#eee">Batal</button><button onclick="doBuat()" class="btn" style="flex:1;background:#facc15">SIMPAN</button></div></div></div>
<!-- MODAL KUNCI / AUTH -->
<div id="mAuth" class="modal"><div class="boxM"><b id="mAuthT">AUTH</b><br><small id="mAuthD"></small><input id="mAuthI" type="password" inputmode="numeric" placeholder="PIN / 9999"><div style="display:flex;gap:8px"><button onclick="closeM('mAuth')" class="btn" style="flex:1;background:#eee">Batal</button><button onclick="doAuth()" class="btn" style="flex:1;background:#15803d;color:white">OK</button></div></div></div>
<!-- MODAL EDIT -->
<div id="mEdit" class="modal"><div class="boxM"><b id="mEditT">EDIT</b><br><small id="mEditD"></small><input id="mEditI" type="number"><div style="display:flex;gap:8px"><button onclick="closeM('mEdit')" class="btn" style="flex:1;background:#eee">Batal</button><button onclick="doEdit()" class="btn" style="flex:1;background:#15803d;color:white">SIMPAN</button></div></div></div>
