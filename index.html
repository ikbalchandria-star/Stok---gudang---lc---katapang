<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST KLIK</title>
</head>
<body style="margin:0;background:green;padding:20px;font-family:sans-serif">
<div style="background:white;padding:20px;border-radius:16px;max-width:400px;margin:auto">

<h2 style="text-align:center">TES KLIK V20.2</h2>

<select id="toko" onchange="gantiToko()" style="width:100%;padding:16px;font-size:18px;border-radius:12px;border:2px solid green">
<option>KATAPANG</option><option>ALFATHU</option><option>GADING TUTUKA</option><option>CIWIDEY</option><option>BALEENDAH</option><option>SUKAMENAK</option><option>BOJONG SOANG</option>
</select>

<button type="button" onclick="alert('KLIK JALAN 1')" style="width:100%;padding:20px;margin-top:15px;background:yellow;font-weight:900;border:none;border-radius:12px;font-size:18px">TES KLIK 1 - KUNCI PIN</button>

<button type="button" onclick="tesPin()" style="width:100%;padding:20px;margin-top:10px;background:green;color:white;font-weight:900;border:none;border-radius:12px;font-size:18px">TES KLIK 2 - BUAT PIN</button>

<button type="button" onclick="tesEdit()" style="width:100%;padding:20px;margin-top:10px;background:blue;color:white;font-weight:900;border:none;border-radius:12px;font-size:18px">TES KLIK 3 - EDIT AWAL</button>

<div id="log" style="margin-top:15px;background:#f0f0f0;padding:12px;border-radius:10px">Log: Siap...</div>

</div>
<script>
function gantiToko(){
 var t=document.getElementById('toko').value;
 document.getElementById('log').innerHTML='Ganti toko: '+t+' - KLIK JALAN!';
 alert('Ganti toko: '+t);
}
function tesPin(){
 var p=prompt('Tes prompt PIN, isi 1234:');
 if(p){alert('Prompt jalan! Kamu isi: '+p); document.getElementById('log').innerHTML='Prompt OK: '+p;}
 else{alert('Prompt dibatalkan');}
}
function tesEdit(){
 var v=prompt('Tes Edit Awal, sekarang 0, ganti jadi berapa?','10');
 if(v){alert('Edit jalan! Nilai baru: '+v); document.getElementById('log').innerHTML='Edit OK: '+v;}
}
alert('JS AKTIF! Kalo alert ini muncul, JS jalan');
document.getElementById('log').innerHTML='JS AKTIF - Silahkan pencet tombol di atas';
</script>
</body></html>
