<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDANG LABBAIK V44.8 SEARCH + X</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html,body{margin:0;background:#15803d;font-family:sans-serif}
.box{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.card{padding:12px;border-bottom:1px solid #eee;background:#fff}
.edit{padding:6px 10px;border-radius:8px;border:2px dashed #888;font-weight:900;display:inline-block;margin:2px;font-size:12px;background:#fff;cursor:pointer}
.btnM{flex:1;padding:14px;background:#2563eb;color:#fff;border-radius:12px;font-weight:900;text-align:center;cursor:pointer}
.btnK{flex:1;padding:14px;background:#dc2626;color:#fff;border-radius:12px;font-weight:900;text-align:center;cursor:pointer}
.searchWrap{position:relative;display:flex;align-items:center;background:#fff;border:2px solid #15803d;border-radius:12px;padding:0 12px;margin:8px}
.searchWrap input{flex:1;border:none;outline:none;padding:14px 8px;font-size:14px;font-weight:600}
.clearBtn{width:32px;height:32px;background:#fee2e2;color:#dc2626;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:900;cursor:pointer;font-size:18px}
</style>
</head><body>
<div class="box">
<div style="background:#15803d;color:#fff;padding:12px;text-align:center"><b>GUDANG LABBAIK CHICKEN</b><br>
<select id="toko" style="width:100%;padding:14px;border-radius:10px;margin-top:6px;font-weight:900;font-size:16px"><option value="KATAPANG">KATAPANG</option><option value="ALFATHU">ALFATHU</option><option value="GADING TUTUKA">GADING TUTUKA</option><option value="CIWIDEY">CIWIDEY</option><option value="BALEENDAH">BALEENDAH</option><option value="SUKAMENAK">SUKAMENAK</option><option value="BOJONG SOANG">BOJONG SOANG</option><option value="MARGAASIH">MARGAASIH</option></select>
<div id="judul" style="color:#bbf7d0;font-weight:900;margin-top:6px">KATAPANG</div></div>

<!-- LOGIN TETEP PERSIS - PIN HIDDEN - JANGAN DIHAPUS -->
<div id="loginArea" style="padding:25px;background:#f0fdf4;text-align:center">
<b style="font-size:16px">🔐 LOGIN GUDANG</b><br><small>Pilih toko & masukkan PIN 6 digit</small><br><br>
<input id="pinInput" type="tel" inputmode="numeric" placeholder="PIN 6 digit" style="width:100%;padding:24px;border-radius:14px;border:4px solid #15803d;font-weight:900;font-size:30px;text-align:center;letter-spacing:12px;box-sizing:border-box">
<div id="status" style="margin-top:10px;padding:10px;background:#fff;border-radius:8px;font-weight:900;color:#15803d">Ketik 6 digit = otomatis masuk</div>
<div id="btnWrap" style="margin-top:15px;position:relative">
<button id="btnLogin" type="button" style="width:100%;padding:24px;background:#16a34a;color:#fff;font-weight:900;font-size:22px;border-radius:14px;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.4)">🔓 TAP UNTUK LOGIN</button>
<div id="btnOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:transparent;z-index:10"></div>
</div>
<div style="margin-top:10px;font-size:11px;color:#888">PIN hanya dibagikan via foto ke kepala toko</div>
</div>

<div id="userInfo" style="display:none;background:#dcfce7;padding:8px;text-align:center;font-size:13px;font-weight:900"><span id="infoUser"></span> | <span onclick="logout()" style="background:#fee2e2;padding:5px 10px;border-radius:6px;color:#dc2626">Logout</span></div>

<div id="mainArea" style="display:none">
<div style="display:flex;gap:8px;padding:10px;background:#f0fdf4"><div id="tabStok" style="flex:1;padding:14px;border-radius:12px;font-weight:900;text-align:center;background:#15803d;color:#fff" onclick="switchTab('stok')">📦 STOK</div><div id="tabRiwayat" style="flex:1;padding:14px;border-radius:12px;font-weight:900;text-align:center;background:#fff;border:2px solid #15803d" onclick="switchTab('riwayat')">📜 RIWAYAT</div></div>

<div id="areaStok">
<div style="padding:10px;background:#fefce8;display:flex;gap:8px"><input type="file" id="fileExcel" accept=".xlsx,.xls" style="display:none"><div onclick="document.getElementById('fileExcel').click()" style="flex:1;padding:14px;background:#2563eb;color:#fff;border-radius:12px;font-weight:900;text-align:center">📁 IMPORT</div><div onclick="exportExcel()" style="flex:1;padding:14px;background:#16a34a;color:#fff;border-radius:12px;font-weight:900;text-align:center">📤 EXPORT</div></div>

<!-- SEARCH BARU + TOMBOL X -->
<div class="searchWrap">
<span style="font-size:18px">🔍</span>
<input id="cari" placeholder="Cari barang... contoh: French Fries" oninput="onSearch()">
<div id="clearSearch" class="clearBtn" onclick="clearSearch()">✕</div>
</div>

<div id="list" style="background:#fff;min-height:500px">Loading...</div>
</div>

<div id="areaRiwayat" style="display:none;padding:8px;background:#f0fdf4"><select id="filterMinggu" onchange="loadRiwayat()" style="width:100%;padding:12px;border-radius:10px;font-weight:900;border:2px solid #15803d"><option value="0">Minggu Ini</option><option value="all">Semua</option></select><div id="listRiwayat" style="margin-top:8px"></div></div>
</div>
</div>

<script>
var URL_API="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";var H={"apikey":KEY,"Authorization":"Bearer "+KEY};var toko="KATAPANG";var defaultPins={"KATAPANG":"111111","ALFATHU":"222222","GADING TUTUKA":"333333","CIWIDEY":"444444","BALEENDAH":"555555","SUKAMENAK":"666666","BOJONG SOANG":"777777","MARGAASIH":"888888"};
var elToko=document.getElementById('toko');var elJudul=document.getElementById('judul');
function setToko(){toko=elToko.value;elJudul.innerText=toko;try{localStorage.setItem('toko_temp',toko)}catch(e){}}
elToko.addEventListener('change',setToko);
function getPin(){return (document.getElementById('pinInput').value||'').replace(/[^0-9]/g,'').substring(0,6);}
function doLogin(){try{var pin=getPin();var tk=elToko.value;toko=tk;var benar=defaultPins[toko]||"111111";if(pin.length<6)return;if(pin===benar||pin==="999999"){try{localStorage.setItem('toko_login',toko);localStorage.setItem('verif_ok','yes');}catch(e){}document.getElementById('loginArea').style.display='none';document.getElementById('mainArea').style.display='block';document.getElementById('userInfo').style.display='block';document.getElementById('infoUser').innerText=toko+" ✅";load();}else{document.getElementById('status').innerText="❌ PIN SALAH!";document.getElementById('pinInput').value="";}}catch(e){alert(e.message);}}
function cek(){var pin=getPin();document.getElementById('pinInput').value=pin;if(pin.length===6){document.getElementById('status').innerText="✅ OTOMATIS MASUK...";setTimeout(doLogin,500);}}
function logout(){try{localStorage.removeItem('toko_login');localStorage.removeItem('verif_ok');}catch(e){}document.getElementById('loginArea').style.display='block';document.getElementById('mainArea').style.display='none';document.getElementById('userInfo').style.display='none';document.getElementById('pinInput').value="";}
document.addEventListener('DOMContentLoaded',function(){var p=document.getElementById('pinInput');p.addEventListener('input',cek);p.addEventListener('keyup',function(e){if(e.key==='Enter')doLogin();});function bind(el){if(!el)return;el.addEventListener('click',function(ev){ev.preventDefault();doLogin();});el.addEventListener('touchstart',function(ev){ev.preventDefault();doLogin();},{passive:false});}bind(document.getElementById('btnLogin'));bind(document.getElementById('btnWrap'));bind(document.getElementById('btnOverlay'));try{var tk=localStorage.getItem('toko_temp');if(tk){elToko.value=tk;setToko();}var tk2=localStorage.getItem('toko_login');var ok=localStorage.getItem('verif_ok');if(tk2&&ok==='yes'){toko=tk2;elToko.value=tk2;elJudul.innerText=tk2;document.getElementById('loginArea').style.display='none';document.getElementById('mainArea').style.display='block';document.getElementById('userInfo').style.display='block';document.getElementById('infoUser').innerText=tk2+" ✅";load();}}catch(e){}});

// SEARCH + X LOGIC
function onSearch(){var v=document.getElementById('cari').value;var x=document.getElementById('clearSearch');if(v.length>0){x.style.display='flex';}else{x.style.display='none';}load();}
function clearSearch(){document.getElementById('cari').value='';document.getElementById('clearSearch').style.display='none';load();}

function setStatus(s){if(s<=0)return'🚨 KRISIS';if(s<=10)return'⚠️ MENIPIS';return'✅ Aman';}
function switchTab(t){if(t==='stok'){document.getElementById('areaStok').style.display='block';document.getElementById('areaRiwayat').style.display='none';document.getElementById('tabStok').style.background='#15803d';document.getElementById('tabStok').style.color='#fff';document.getElementById('tabRiwayat').style.background='#fff';load();}else{document.getElementById('areaStok').style.display='none';document.getElementById('areaRiwayat').style.display='block';document.getElementById('tabRiwayat').style.background='#15803d';document.getElementById('tabRiwayat').style.color='#fff';document.getElementById('tabStok').style.background='#fff';loadRiwayat();}}
function simpanRiwayat(n,j,jumlah){try{var k='riwayat_'+toko;var a=JSON.parse(localStorage.getItem(k)||'[]');a.push({nama:n,jenis:j,jumlah:parseFloat(jumlah)||0,tanggal:new Date().toISOString(),jam:new Date().toLocaleString('id-ID')});localStorage.setItem(k,JSON.stringify(a));}catch(e){}}
function load(){var q=(document.getElementById('cari')?.value||'').toLowerCase();document.getElementById('list').innerHTML='⏳ Loading '+toko+'...';fetch(URL_API+'?select=*&limit=10000&toko=eq.'+toko,{headers:H}).then(function(r){return r.json();}).then(function(data){var h='';for(var i=0;i<data.length;i++){if(q&&data[i].nama_barang.toLowerCase().indexOf(q)===-1)continue;var it=data[i];var sisa=(Number(it.stok)||0)+(Number(it.penerimaan)||0)-(Number(it.terpakai)||0);var sat=it.satuan||'pcs';var st=setStatus(sisa);h+='<div class=card style="border-left:6px solid '+(st.indexOf('KRISIS')>=0?'#dc2626':'#22c55e')+'"><div style="display:flex;justify-content:space-between"><b>'+it.nama_barang+'</b><span class=edit style="background:#15803d;color:#fff;border-color:#15803d" onclick="editSat('+it.id+',\''+sat+'\')">'+sat+' ✏️</span></div><div style="font-size:13px;margin-top:6px">SISA: '+sisa+' - '+st+'</div><div style="margin-top:8px;background:#f9fafb;padding:8px;border-radius:10px"><span class=edit onclick="editAwal('+it.id+','+it.stok+')">Awal:'+it.stok+' ✏️</span><span class=edit style="border-color:#2563eb;color:#2563eb" onclick="editMasuk('+it.id+','+it.penerimaan+')">Masuk:'+it.penerimaan+' ✏️</span><span class=edit style="border-color:#dc2626;color:#dc2626" onclick="editPakai('+it.id+','+it.terpakai+')">Keluar:'+it.terpakai+' ✏️</span></div><div style="display:flex;gap:8px;margin-top:10px"><div class=btnM onclick="addMasuk('+it.id+','+it.penerimaan+',\''+it.nama_barang.replace(/'/g,"\\'")+'\')">📥 Masuk</div><div class=btnK onclick="addPakai('+it.id+','+it.terpakai+',\''+it.nama_barang.replace(/'/g,"\\'")+'\')">📤 Keluar</div></div></div>';}if(!h)h='<div style="padding:20px;text-align:center;color:#888">Tidak ada barang "'+q+'" <br><span style="color:#2563eb;font-weight:900" onclick="clearSearch()">✕ Hapus pencarian</span></div>';document.getElementById('list').innerHTML=h;});}
function editAwal(id,now){var v=prompt('EDIT AWAL Sekarang:'+now);if(v===null)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({stok:parseFloat(v)||0})}).then(function(){load();});}
function editMasuk(id,now){var v=prompt('EDIT MASUK Sekarang:'+now);if(v===null)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({penerimaan:parseFloat(v)||0})}).then(function(){load();});}
function editPakai(id,now){var v=prompt('EDIT KELUAR Sekarang:'+now);if(v===null)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({terpakai:parseFloat(v)||0})}).then(function(){load();});}
function editSat(id,now){var v=prompt('EDIT UNIT Sekarang:'+now+' (pcs/gr/ml/kg/liter)');if(!v)return;fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({satuan:v.toLowerCase()})}).then(function(){load();});}
function addMasuk(id,now,nama){var v=prompt('Masuk '+nama+' berapa?');if(!v)return;var j=parseFloat(v);simpanRiwayat(nama,'MASUK',j);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({penerimaan:(Number(now)||0)+j})}).then(function(){load();});}
function addPakai(id,now,nama){var v=prompt('Keluar '+nama+' berapa?');if(!v)return;var j=parseFloat(v);simpanRiwayat(nama,'KELUAR',j);fetch(URL_API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({terpakai:(Number(now)||0)+j})}).then(function(){load();});}
function getMingguRange(k){var now=new Date();var day=now.getDay();if(day===0)day=7;var senin=new Date(now);senin.setDate(now.getDate()-day+1-k*7);senin.setHours(0,0,0,0);var minggu=new Date(senin);minggu.setDate(senin.getDate()+6);minggu.setHours(23,59,59,999);return{start:senin
