<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STOK GUDANG LC</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;max-width:480px;margin:0 auto;padding:16px;background:#fafafa}.card{border:1px solid #ddd;border-radius:14px;padding:12px;background:#fff;margin-bottom:12px}input{padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin-bottom:8px}button{padding:10px 14px;border-radius:10px;border:0;font-weight:bold;cursor:pointer}.btn-add{background:#00df81;width:100%;padding:14px;font-size:16px}.btn-mini{background:#eee;margin:2px;padding:6px 10px}.badge{background:#f2f2f2;padding:8px;border-radius:10px;text-align:center;flex:1;font-size:13px}.flex{display:flex;gap:8px}.config{background:#111;color:#fff;padding:12px;border-radius:12px;margin-bottom:16px}.config input{background:#222;color:#fff;border-color:#444}.config small{color:#888}</style></head><body><h1 style="text-align:center">📦 STOK GUDANG LC</h1><div class="config"><small>PASTE KUNCI SUPABASE DI SINI (sekali aja)</small><input id="url" value="https://lgunwtgwlzggfmfjzxqm.supabase.co"><input id="key" placeholder="sb_publishable_... PASTE DISINI"><button onclick="saveConfig()" style="background:#00df81;width:100%">Simpan & Connect</button><div id="status" style="font-size:12px;margin-top:6px;color:#aaa"></div></div><div id="app" style="display:none"><div style="display:flex;gap:8px;margin-bottom:12px"><input id="nama" placeholder="Nama barang" style="flex:2"><input id="stok" type="number" placeholder="Stok" style="flex:1"><input id="pakai" type="number" placeholder="Pakai" style="flex:1"></div><button class="btn-add" onclick="tambah()">+ Tambah Barang</button><div id="list" style="margin-top:20px">Loading...</div></div><script>let supa=null;function saveConfig(){const u=document.getElementById('url').value.trim();const k=document.getElementById('key').value.trim();if(!k){alert('Paste Key dulu bay!');return;}localStorage.setItem('SUPA_URL',u);localStorage.setItem('SUPA_KEY',k);connect(u,k);}function connect(u,k){try{supa=supabase.createClient(u,k);document.getElementById('status').innerText='✅ Connected';document.getElementById('app').style.display='block';loadBarang();}catch(e){document.getElementById('status').innerText='❌ '+e.message;}}async function loadBarang(){const{data,error}=await supa.from('barang').select('*').order('nama');if(error){document.getElementById('list').innerHTML='<p style=color:red>'+error.message+'</p>';return;}let h='';if(!data||!data.length)h='<p style=text-align:center;color:#888>Belum ada barang, tambah di atas</p>';else data.forEach(b=>{const sisa=(b.stok||0)-(b.terpakai||0);h+=`<div class=card><div style=display:flex;justify-content:space-between><b>${b.nama}</b><span style=color:red;cursor:pointer onclick="hapus('${b.id}')">✕ hapus</span></div><div class=flex style=margin-top:8px><div class=badge>Stok<br><b>${b.stok}</b><br><button class=btn-mini onclick="upd('${b.id}','stok',-1)">-</button><button class=btn-mini onclick="upd('${b.id}','stok',1)">+</button></div><div class=badge>Terpakai<br><b>${b.terpakai}</b><br><button class=btn-mini onclick="upd('${b.id}','terpakai',-1)">-</button><button class=btn-mini onclick="upd('${b.id}','terpakai',1)">+</button></div><div class=badge style=background:#e6ffef>Sisa<br><b style=font-size:18px>${sisa}</b></div></div></div>`});document.getElementById('list').innerHTML=h;}async function tambah(){const nama=document.getElementById('nama').value.trim();const stok=parseInt(document.getElementById('stok').value||0);const terpakai=parseInt(document.getElementById('pakai').value||0);if(!nama)return alert('Nama harus diisi');const{error}=await supa.from('barang').insert({nama,stok,terpakai});if(error)alert(error.message);else{document.getElementById('nama').value='';document.getElementById('stok').value='';document.getElementById('pakai').value='';loadBarang();}}async function hapus(id){if(!confirm('Hapus barang ini?'))return;await supa.from('barang').delete().eq('id',id);loadBarang();}async function upd(id,field,delta){const{data}=await supa.from('barang').select('*').eq('id',id).single();let nv=Math.max(0,(data[field]||0)+delta);await supa.from('barang').update({[field]:nv}).eq('id',id);loadBarang();}(function(){const u=localStorage.getItem('SUPA_URL');const k=localStorage.getItem('SUPA_KEY');if(u)document.getElementById('url').value=u;if(k){document.getElementById('key').value=k;connect(u,k);}})();</script></body></html>
