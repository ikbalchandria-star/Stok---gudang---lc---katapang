<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LABBAIK V18.5c FIX TOUCH</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:sans-serif;background:#f0f0f0}
.header{background:#15803d;color:white;padding:16px;position:sticky;top:0}
.btn{padding:12px;border-radius:12px;border:none;font-weight:900;cursor:pointer}
.card{background:white;margin:10px;padding:12px;border-radius:16px;box-shadow:0 2px 6px #0001}
</style>
</head>
<body>
<div style="max-width:480px;margin:auto;background:white;min-height:100vh">
  <div class="header">
    <div style="text-align:center;font-weight:900">GUDANG LABBAIK CHICKEN</div>
    <div id="judul" style="text-align:center;color:#fde047;font-size:13px;margin-top:4px">PILIH TOKO DULU</div>
    <select id="toko" style="width:100%;padding:12px;border-radius:12px;margin-top:12px;font-weight:bold;color:black">
      <option value="KATAPANG">KATAPANG</option>
      <option value="ALFATHU">ALFATHU</option>
      <option value="GADING TUTUKA">GADING TUTUKA</option>
      <option value="CIWIDEY">CIWIDEY</option>
    </select>
    <button onclick="kunciBaru()" style="width:100%;margin-top:8px;background:#facc15;padding:12px;border-radius:12px;font-weight:900;border:none">🔒 KUNCI & BUAT PIN</button>
    <div id="areaKunci" style="display:none;text-align:center;margin-top:8px">
      <span id="labelToko" style="background:white;color:#15803d;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px"></span><br>
      <button onclick="gantiToko()" style="background:none;border:none;color:#fde047;text-decoration:underline;margin-top:6px;font-size:11px">Ganti Toko</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:12px">
      <button onclick="setSO('harian')" id="b-harian" class="btn" style="flex:1;background:#facc15;color:black">HARIAN</button>
      <button onclick="setSO('mingguan')" id="b-mingguan" class="btn" style="flex:1;background:#ffffff33;color:white">MINGGUAN</button>
      <button onclick="setSO('bulanan')" id="b-bulanan" class="btn" style="flex:1;background:#ffffff33;color:white">BULANAN</button>
    </div>
  </div>

  <div style="padding:12px;background:#fef9c3;display:flex;gap:6px">
    <input id="cari" oninput="load()" placeholder="Cari barang" style="flex:1;padding:12px;border-radius:12px;border:1px solid #ccc">
    <button onclick="load()" class="btn" style="background:#15803d;color:white">Cari</button>
  </div>

  <div id="list" style="padding:12px">Pilih toko dulu, pencet KUNCI & BUAT PIN...</div>
</div>

<script>
const URL="https://lgunwtgwlzggfmfjzxqm.supabase.co/rest/v1/stok";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndW53dGd3bHpnZ2ZtZmp6eHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTAyMzMsImV4cCI6MjEwNjgyNjIzM30.enegbpFm3USOJ26xynabx-pJfoDk-RRrP_xUv3T0tJw";
const H={"apikey":KEY,"Authorization":"Bearer "+KEY};
let toko=localStorage.getItem('toko_labbaik');
let terkunci=localStorage.getItem('toko_terkunci')==='1';
let so=localStorage.getItem('so_type')||'harian';
let login=false;
const MASTER="9999";
function getPin(t){return localStorage.getItem('pin_'+t);}
function setPin(t,p){localStorage.setItem('pin_'+t,p);}

function setSO(s){
  so=s; localStorage.setItem('so_type',s);
  document.getElementById('b-harian').style.background=s=='harian'?'#facc15':'#ffffff33';
  document.getElementById('b-harian').style.color=s=='harian'?'black':'white';
  document.getElementById('b-mingguan').style.background=s=='mingguan'?'#facc15':'#ffffff33';
  document.getElementById('b-mingguan').style.color=s=='mingguan'?'black':'white';
  document.getElementById('b-bulanan').style.background=s=='bulanan'?'#facc15':'#ffffff33';
  document.getElementById('b-bulanan').style.color=s=='bulanan'?'black':'white';
  document.getElementById('judul').innerText=(toko||'PILIH TOKO')+' | SO '+s.toUpperCase();
  if(toko && login) load();
}

function init(){
  setSO(so);
  if(!toko){
    document.getElementById('list').innerHTML='Pilih toko dulu di atas ☝️';
    return;
  }
  document.getElementById('toko').value=toko;
  let pin=getPin(toko);
  if(!pin){
    document.getElementById('judul').innerText=toko+' BELUM ADA PIN - BIKIN DULU!';
    document.getElementById('list').innerHTML='<div class=card>⚠️ Toko '+toko+' belum punya PIN!<br><br><button onclick=kunciBaru() class=btn style=background:#15803d;color:white;width:100%>Bikin PIN Sekarang</button></div>';
    return;
  }
  if(terkunci && !login){
    document.getElementById('judul').innerText=toko+' TERKUNCI 🔒';
    document.getElementById('areaKunci').style.display='block';
    document.getElementById('labelToko').innerText=toko+' TERKUNCI';
    document.getElementById('list').innerHTML='<div class=card style=text-align:center><b>🔒 '+toko+' Terkunci Privasi!</b><br><small>Kepala toko baru wajib PIN</small><br><br><button onclick=mintaPin() class=btn style=background:#15803d;color:white;width:100%;padding:16px>🔓 MASUKAN PIN</button></div>';
    setTimeout(mintaPin,400);
    return;
  }
  // sudah login
  login=true;
  document.getElementById('areaKunci').style.display='block';
  document.getElementById('labelToko').innerText=toko+' | '+so.toUpperCase();
  document.getElementById('judul').innerText=toko+' | SO '+so.toUpperCase();
  load();
}

function mintaPin(){
  let p=prompt('MASUKAN PIN TOKO '+toko+'\nMaster: 9999');
  if(p===null) return;
  if(p===getPin(toko) || p===MASTER){
    login=true;
    load();
  }else{
    alert('PIN Salah!');
  }
}

function kunciBaru(){
  let t=document.getElementById('toko').value;
  let lama=getPin(t);
  if(lama){
    let cek=prompt('Toko '+t+' sudah ada PIN, masukan PIN lama:');
    if(cek!==lama && cek!==MASTER) return alert('Salah!');
    localStorage.setItem('toko_labbaik',t);
    localStorage.setItem('toko_terkunci','1');
    toko=t; terkunci=true; login=false;
    init(); return;
  }
  let p1=prompt('Bikin PIN baru untuk '+t+' (4 angka):');
  if(!p1 || p1.length<4) return alert('Minimal 4!');
  let p2=prompt('Ulangi PIN:');
  if(p1!==p2) return alert('Gak sama!');
  setPin(t,p1);
  localStorage.setItem('toko_labbaik',t);
  localStorage.setItem('toko_terkunci','1');
  toko=t; terkunci=true; login=true;
  alert('PIN '+t+' jadi '+p1);
  init();
}

function gantiToko(){
  let p=prompt('PIN toko '+toko+' untuk ganti toko:');
  if(p!==getPin(toko) && p!==MASTER) return alert('PIN salah!');
  localStorage.setItem('toko_terkunci','0');
  terkunci=false; login=false; toko=null;
  localStorage.removeItem('toko_labbaik');
  document.getElementById('areaKunci').style.display='none';
  init();
}

async function load(){
  if(!toko) return;
  if(!login){
    let pin=getPin(toko);
    if(pin) return mintaPin();
  }
  document.getElementById('list').innerHTML='⏳ Loading '+toko+'...';
  try{
    let q=document.getElementById('cari').value.toLowerCase();
    let r=await fetch(URL+'?select=*&limit=1000&toko=eq.'+toko,{headers:H});
    let data=await r.json();
    if(!Array.isArray(data)) throw new Error('Gagal load');
    let fil=data.filter(x=>!q || x.nama_barang.toLowerCase().includes(q));
    if(fil.length==0){document.getElementById('list').innerHTML='<div class=card>Belum ada barang di '+toko+'<br>Import dulu atau tambah manual</div>'; return;}
    let h='';
    fil.forEach(it=>{
      let sisa=(+it.stok||0)+(+it.penerimaan||0)-(+it.terpakai||0);
      h+='<div class=card><b>'+it.nama_barang+'</b><br><small>'+it.satuan+' | SISA: <b style=color:green>'+sisa+'</b></small><br><div style=display:flex;gap:6px;margin-top:8px><button onclick=tambahMasuk('+it.id+','+it.penerimaan+') class=btn style=flex:1;background:#2563eb;color:white>Tambah</button><button onclick=pakai('+it.id+','+it.terpakai+') class=btn style=flex:1;background:#dc2626;color:white>Pakai</button></div></div>';
    });
    document.getElementById('list').innerHTML=h;
  }catch(e){document.getElementById('list').innerHTML='Gagal: '+e.message;}
}

async function tambahMasuk(id,now){let j=prompt('Tambah berapa?'); if(!j) return; let v=parseFloat(j); await fetch(URL+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({penerimaan:(+now||0)+v})}); load();}
async function pakai(id,now){let j=prompt('Pakai berapa?'); if(!j) return; let v=parseFloat(j); await fetch(URL+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({terpakai:(+now||0)+v})}); load();}

init();
</script>
</body>
</html>
