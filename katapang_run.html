<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KATAPANG RUN</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}body{background:#15803d;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.box{width:100%;max-width:480px;height:100vh;background:#87CEEB;position:relative;overflow:hidden;display:flex;flex-direction:column}#canvas{flex:1;width:100%;display:block}.ui{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;color:#fff;font-weight:900;text-shadow:2px 2px 0 #000;font-size:14px;z-index:10}.btn{padding:16px 32px;background:#16a34a;color:#fff;border-radius:14px;font-weight:900;font-size:18px;border:4px solid #fff}.menu{position:absolute;inset:0;background:rgba(21,128,61,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center;padding:20px;z-index:30}</style>
</head><body>
<div class="box">
<div class="ui"><span id="score">🍟 0</span><span>KATAPANG RUN</span><span id="best">BEST: 0</span></div>
<canvas id="canvas"></canvas>
<div id="menu" class="menu"><h1>🏃 KATAPANG RUN</h1><div style="background:#fff;color:#15803d;padding:10px;border-radius:10px;font-weight:900;margin:10px 0">Kepala Toko Katapang Lari!</div><div>Tap untuk LONCAT!<br>Ambil 🍟 French Fries<br>Hindari 🚨 KRISIS!</div><button class="btn" style="margin-top:20px" onclick="startGame()">🚀 MULAI LARI!</button></div>
<div id="gameOver" class="menu" style="display:none"><h1>💥 GAME OVER!</h1><div id="finalScore"></div><div id="rank" style="background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-weight:900"></div><button class="btn" style="margin-top:20px" onclick="startGame()">🔄 MAIN LAGI!</button></div>
</div>
<script>
const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let W,H,player,obstacles=[],collects=[],clouds=[],score=0,gameRunning=false,speed=4,groundY,gravity=0.6;function resize(){W=canvas.parentElement.clientWidth;H=canvas.parentElement.clientHeight;canvas.width=W;canvas.height=H;groundY=H*0.78;}resize();const ITEMS=[{e:'🍟'},{e:'🍔'},{e:'🍗'},{e:'🧀'},{e:'🥤'}];class Player{constructor(){this.w=44;this.h=44;this.x=60;this.y=groundY-this.h;this.vy=0;this.jumping=false;this.anim=0;}update(){this.vy+=gravity;this.y+=this.vy;if(this.y>=groundY-this.h){this.y=groundY-this.h;this.vy=0;this.jumping=false;}this.anim+=0.2;}jump(){if(!this.jumping){this.vy=-12.5;this.jumping=true;}}draw(){ctx.save();ctx.translate(this.x+this.w/2,this.y+this.h/2);ctx.font=this.w+'px serif';ctx.textAlign='center';ctx.fillText(this.jumping?'🦸':'🏃',0,0);ctx.restore();}}function startGame(){player=new Player();obstacles=[];collects=[];clouds=[];score=0;speed=4;gameRunning=true;for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:50+Math.random()*100,s:0.5+Math.random()*1.2});document.getElementById('menu').style.display='none';document.getElementById('gameOver').style.display='none';requestAnimationFrame(loop);}function loop(){if(!gameRunning)return;speed+=0.002;ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#60a5fa');g.addColorStop(0.6,'#87CEEB');g.addColorStop(0.6,'#fde68a');g.addColorStop(1,'#f59e0b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.8)';clouds.forEach(c=>{c.x-=c.s;if(c.x<-80){c.x=W+20;}ctx.beginPath();ctx.ellipse(c.x,c.y,60,20,0,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#15803d';ctx.fillRect(0,groundY,W,H-groundY);if(Math.random()<0.025)obstacles.push({x:W,y:groundY-38,w:34,h:38,t:Math.random()<0.5?'KRISIS':'BOX'});if(Math.random()<0.03){let it=ITEMS[Math.floor(Math.random()*ITEMS.length)];collects.push({x:W,y:groundY-90-Math.random()*80,w:30,h:30,e:it.e});}collects.forEach((c,i)=>{c.x-=speed;ctx.font='26px serif';ctx.fillText(c.e,c.x,c.y);if(c.x<player.x+player.w&&c.x+c.w>player.x&&c.y<player.y+player.h&&c.y+c.h>player.y){score+=10;document.getElementById('score').innerText='🍟 '+score;collects.splice(i,1);}if(c.x<-40)collects.splice(i,1);});obstacles.forEach((o,i)=>{o.x-=speed;ctx.fillStyle=o.t==='KRISIS'?'#dc2626':'#92400e';ctx.fillRect(o.x,o.y,o.w,o.h);if(o.x<player.x+player.w-10&&o.x+o.w>player.x+10&&o.y<player.y+player.h-6&&o.y+o.h>player.y+8){gameOver();}if(o.x<-50)obstacles.splice(i,1);});player.update();player.draw();if(gameRunning)requestAnimationFrame(loop);}function gameOver(){gameRunning=false;let b=parseInt(localStorage.getItem('katapang_best')||'0');if(score>b)localStorage.setItem('katapang_best',score);document.getElementById('finalScore').innerText='Skor: '+score;document.getElementById('rank').innerText=score<150?'Staff Gudang':'Kepala Toko Katapang';document.getElementById('gameOver').style.display='flex';}
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(gameRunning)player.jump();},{passive:false});
canvas.addEventListener('mousedown',()=>{if(gameRunning)player.jump();});
resize();
</script>
</body></html>
